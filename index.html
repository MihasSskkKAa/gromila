  limb(shR.x-rc, shR.y, elR.x-rc, elR.y, 6, B.skin);
  limb(elR.x-rc, elR.y, haR.x-rc, haR.y, 5, B.skinHi);
  px(haR.x-7-rc, haR.y-5, 13, 11, B.skin);

  // камень в занесённой руке
  if(boss.state === "windup" && boss.pending){
    const big = boss.pending.kind === "boulder";
    drawShot(haR.x-rc, haR.y-9, big?9:6, 0.7);
  }

  // «ГРР!» при рёве
  if(boss.roar > 0){
    g.globalAlpha = clamp(boss.roar, 0, 1);
    px(bx+18, hy-26, 3, 3, P.magenta);
    px(bx+26, hy-32, 3, 3, P.magenta);
    px(bx-24, hy-30, 3, 3, P.magenta);
    g.globalAlpha = 1;
  }
}

/* ============================================================
   ЯРИК
   ============================================================ */
function drawHero(){
  // купол щита: перед тем как погаснуть, начинает мигать
  if(hero.shield > 0 && !(hero.shield < 1.2 && Math.floor(hero.shield*8) % 2 === 0)){
    const rr = 13 + Math.sin(time*6)*1;
    g.globalAlpha = 0.75;
    ring(hero.x, GROUND_Y-11, rr, rr*1.15, P.cyan, 1);
    g.globalAlpha = 0.18;
    g.fillStyle = P.cyan;
    g.beginPath(); g.ellipse(hero.x, GROUND_Y-11, rr, rr*1.15, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
  if(hero.inv > 0 && Math.floor(hero.inv*14) % 2 === 0) return;
  const x = hero.x|0, y = GROUND_Y;
  const moving = Math.abs(hero.vx) > 4;
  const f = moving ? (Math.floor(hero.walk*9) % 4) : 0;
  const bob = (f===1||f===3) ? 1 : 0;

  g.globalAlpha=.4; disc(x, y+1, 8, T.shade); g.globalAlpha=1;

  // ноги
  if(moving){
    const sw = (f===0||f===1) ? 1 : -1;
    px(x-4+sw, y-7, 3, 7, P.pants);
    px(x+1-sw, y-7, 3, 7, P.pants);
    px(x-5+sw, y-1, 5, 2, P.dark);
    px(x+1-sw, y-1, 5, 2, P.dark);
  } else {
    px(x-4, y-7, 3, 7, P.pants);
    px(x+1, y-7, 3, 7, P.pants);
    px(x-5, y-1, 5, 2, P.dark);
    px(x, y-1, 5, 2, P.dark);
  }

  const ty = y - 7 - bob;
  // туловище
  px(x-5, ty-9, 10, 9, P.shirt);
  px(x-5, ty-9, 3, 9, P.shirtLo);
  px(x-5, ty-2, 10, 2, P.shirtLo);
  // руки
  const ar = moving ? Math.sin(hero.walk*9*Math.PI/2)*2 : 0;
  px(x-7, ty-8+ar, 2, 6, P.shirt);
  px(x+5, ty-8-ar, 2, 6, P.shirt);
  px(x-7, ty-2+ar, 2, 2, P.skin);
  px(x+5, ty-2-ar, 2, 2, P.skin);
  // голова
  px(x-4, ty-17, 8, 8, P.skin);
  px(x-4, ty-19, 8, 4, P.hair);
  px(x-5, ty-18, 1, 3, P.hair);
  px(x+4, ty-18, 1, 3, P.hair);
  px(x-1, ty-21, 3, 2, P.hair);            // вихор
  const ex = hero.dir > 0 ? 1 : -1;
  px(x-1+ex, ty-14, 2, 2, P.dark);
  px(x-3+ex, ty-14, 1, 2, P.dark);
  px(x-2, ty-10, 4, 1, "#d99a72");
}

/* ============================================================
   КАМНИ
   ============================================================ */
/* Снаряд рисуется по-своему у каждого соперника, но всегда с учётом
   масштаба: чем ближе к земле, тем крупнее — так читается глубина. */
function drawShot(x, y, r, sc, rk){
  const S = curBoss().shot;
  const R = Math.max(2, Math.round(r*(sc||1)));
  x = x|0; y = y|0;

  if(curBoss().id === "strelok"){
    /* Стрела: древко, гранёный наконечник и оперение — всё разворачивается
       по направлению полёта, поэтому в дуге она ведёт себя как настоящая. */
    const ang  = rk && rk.dir !== undefined ? rk.dir : 1.3;
    const len  = Math.max(11, R*3.4);
    const sh   = Math.max(1, R*0.34);          // толщина древка
    const head = Math.max(2.2, R*0.85);        // размах наконечника
    const tail = Math.max(2, R*0.8);           // размах оперения

    g.save();
    g.translate(x, y);
    g.rotate(ang);

    g.fillStyle = S.lo;                        // тень древка снизу
    g.fillRect(-len*0.52, -sh*0.1, len*0.92, sh);
    g.fillStyle = S.main;                      // само древко
    g.fillRect(-len*0.52, -sh*0.9, len*0.92, sh);

    g.fillStyle = S.hi;                        // наконечник
    g.beginPath();
    g.moveTo(len*0.50, 0);
    g.lineTo(len*0.22, -head);
    g.lineTo(len*0.30, 0);
    g.lineTo(len*0.22, head);
    g.closePath(); g.fill();

    g.fillStyle = "#d8574f";                   // два пера у хвоста
    g.beginPath();
    g.moveTo(-len*0.52, 0);
    g.lineTo(-len*0.26, -tail);
    g.lineTo(-len*0.12, -tail*0.55);
    g.lineTo(-len*0.34, 0);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(-len*0.52, 0);
    g.lineTo(-len*0.26, tail);
    g.lineTo(-len*0.12, tail*0.55);
    g.lineTo(-len*0.34, 0);
    g.closePath(); g.fill();

    g.restore();
    return;
  }

  if(curBoss().id === "snegovik"){
    disc(x, y, R, S.lo);
    disc(x-Math.round(R*0.18), y-Math.round(R*0.2), Math.max(1,Math.round(R*0.82)), S.main);
    px(x-R*0.45, y-R*0.6, Math.max(1,R*0.35), Math.max(1,R*0.3), S.hi);
    return;
  }

  disc(x, y, R, S.lo);
  disc(x-Math.round(R*0.2), y-Math.round(R*0.22), Math.max(1,Math.round(R*0.78)), S.main);
  px(x-R*0.5, y-R*0.7, Math.max(1,R*0.4), Math.max(1,R*0.3), S.hi);
  px(x+R*0.1, y+R*0.1, Math.max(1,R*0.35), Math.max(1,R*0.25), S.lo);
}

/* ============================================================
   ЧАСТИЦЫ / ТЕКСТЫ / ВОРОНКИ
   ============================================================ */
function burst(x, y, n, spread, colors, up){
  for(let i=0;i<n && parts.length<260;i++){
    const a = rnd(-Math.PI, 0);
    const sp = rnd(20, spread);
    parts.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp*(up||1),
      life: rnd(0.35,0.9), max:0.9,
      s: Math.random()<0.3?2:1,
      c: colors[(Math.random()*colors.length)|0]
    });
  }
}
/* отдача в ладонь; браузер отклоняет вызов до первого настоящего касания — это не ошибка */
function buzz(pattern){
  if(!navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch(e){}
}

function say(text, x, y, color, big){
  texts.push({text, x, y, life: big?1.6:1.1, color, big:!!big});
}

/* ============================================================
   ЛОГИКА БОЯ
   ============================================================ */
const WINDUP = 0.55;

function difficulty(){
  const D = curDiff();
  wave = Math.floor(runTime * D.ramp / 16) + 1;
  const k = Math.min(1, (wave-1)/9);
  const K = curBoss().kit;
  return {
    k,
    gap:    Math.max(0.26, (1.55 - k*1.05) * D.gap * K.gap),
    flight: Math.max(0.48, (1.55 - k*0.62) * D.flight * K.fly),
    volley: Math.min(0.90, (0.10 + k*0.40) * D.volley),
    boulder:Math.min(0.55, (0.06 + k*0.20) * D.boulder)
  };
}

function planThrow(){
  const d = difficulty();
  const D = curDiff();
  const aimK = clamp(d.k * D.aim, 0, 1);        // 0 — швыряет наугад, 1 — бьёт прицельно
  const kind = Math.random() < d.boulder ? "boulder" : "rock";
  const flight = d.flight * (kind==="boulder" ? 1.25 : 1) * rnd(0.92, 1.08);

  /* Прицел складывается из двух вещей. Хаос — доля случайности в точке падения,
     она тает с волнами. Упреждение — насколько верно он угадывает, куда Ярик
     добежит: сначала мажет мимо, под конец ведёт точно по движению. */
  const chaos = clamp(0.80 - aimK*0.76, 0.04, 0.85);
  const lead  = lerp(rnd(0.15,0.55), rnd(0.80,1.10), aimK);
  // когда стены сошлись, бить за них бессмысленно — Ярика там нет
  const lo = zoneMinX() - 6, hi = zoneMaxX() + 6;
  const predict = clamp(hero.x + hero.vx*flight*lead, lo, hi);
  const center  = clamp(predict*(1-chaos) + rnd(lo, hi)*chaos, lo, hi);

  /* Пристрелявшись, бьёт в вилку: один в Ярика, два по бокам — стоять негде.
     У края поля вилку не ставим: там Ярику некуда отбежать, и это была бы
     не сложность, а безвыходность. */
  const roomToRun = center > 78*(W/480) && center < W - 78*(W/480);
  const pin = kind === "rock" && aimK > 0.45 && roomToRun &&
              Math.random() < 0.20 + aimK*0.28;
  const volley = !pin && kind === "rock" && Math.random() < d.volley;

  const targets = [];
  if(pin){
    const arm = (26 + 16*(1-aimK)) * (W/480);
    targets.push(center, clamp(center-arm, 26, W-26), clamp(center+arm, 26, W-26));
  } else if(volley){
    const count = Math.random() < 0.3 ? 3 : 2;
    const spread = rnd(58, 96) * (W/480) * (1 - aimK*0.45);   // с прицелом залп кучнее
    for(let i=0;i<count;i++){
      targets.push(clamp(center + (i - (count-1)/2)*spread, 26, W-26));
    }
  } else {
    targets.push(center);
  }
  return {kind, targets, flight, pin};
}

function releaseThrow(plan){
  const handX = boss.x + 34, handY = BOSS_FEET - 96;
  for(const tx of plan.targets){
    rocks.push({
      kind: plan.kind,
      pin: !!plan.pin,
      threat: false,          // стоял ли Ярик под этим камнем хоть раз
      x0: handX, y0: handY,
      tx, t: 0,
      dur: plan.flight,
      r: plan.kind === "boulder" ? 13 : 7,
      spin: rnd(-9, 9),
      rot: 0,
      x: handX, y: handY, sc: 0.4
    });
  }
  boss.recoil = 4;
  Audio5.sfx(curBoss().sfx.throw);
}

function rockAt(rk){
  const t = clamp(rk.t / rk.dur, 0, 1);
  const arc = curBoss().kit.arc + (rk.kind==="boulder" ? 16 : 0);
  const prevX = rk.x, prevY = rk.y;
  rk.x = lerp(rk.x0, rk.tx, t);
  rk.y = lerp(rk.y0, GROUND_Y - 4, t) - Math.sin(Math.PI*t)*arc;
  rk.sc = lerp(0.42, rk.kind==="boulder" ? 1.5 : 1.15, t);
  // направление движения — стрела должна смотреть туда, куда летит
  if(prevX !== undefined) rk.dir = Math.atan2(rk.y - prevY, rk.x - prevX);
}

const hitRadiusOf = rk => rk.kind === "boulder" ? curBoss().kit.bigR : curBoss().kit.hitR;

/* Комья должны мешать, но не запирать. Новый ком не появляется, если
   комьев уже много, если он ляжет вплотную к соседнему или если после
   него у Ярика не останется коридора, куда отбежать. */
const SNOW_LIMIT = 3;          // сколько комьев может лежать разом
const SNOW_GAP   = 20;         // просвет между зонами удара соседних комьев
const SNOW_LANE  = 56;         // сколько места остаётся Ярику для манёвра
const snowHitR   = r => r + 4; // ком бьёт чуть шире, чем нарисован

function canDropSnow(x, r){
  const live = hazards.filter(h => h.life > 0.3);
  if(live.length >= SNOW_LIMIT) return false;
  // между зонами удара должен оставаться проход, а не щель в пару пикселей
  for(const h of live){
    if(Math.abs(h.x - x) < snowHitR(h.r) + snowHitR(r) + SNOW_GAP) return false;
  }
  // и у Ярика должен остаться коридор, куда отбежать
  let left = HERO_MIN_X - 10, right = HERO_MAX_X + 10;
  const blocks = live.map(h => [h.x - snowHitR(h.r), h.x + snowHitR(h.r)]);
  blocks.push([x - snowHitR(r), x + snowHitR(r)]);
  for(const [a, b] of blocks){
    if(b < hero.x) left  = Math.max(left, b);
    if(a > hero.x) right = Math.min(right, a);
  }
  return (right - left) >= SNOW_LANE;
}

/* Проверки при падении не всё покрывают: Ярик может сам забежать между
   комьями или ком может лечь ему под ноги. Если он оказался зажат — самый
   мешающий ком тает, и выход всегда есть. */
function freeTheLane(){
  if(state !== "play" || !hazards.length) return;
  let left = HERO_MIN_X - 10, right = HERO_MAX_X + 10, inside = null;
  for(const h of hazards){
    const a = h.x - snowHitR(h.r), b = h.x + snowHitR(h.r);
    if(a <= hero.x && b >= hero.x) inside = h;
    else if(b < hero.x) left  = Math.max(left, b);
    else                right = Math.min(right, a);
  }
  if(!inside && right - left >= SNOW_LANE) return;

  // тает тот, что стоит ближе всех к Ярику
  let victim = inside;
  if(!victim){
    let best = Infinity;
    for(const h of hazards){
      const d = Math.abs(h.x - hero.x);
      if(d < best){ best = d; victim = h; }
    }
  }
  if(!victim) return;
  burst(victim.x, GROUND_Y-4, 12, 70, curBoss().shot.dust, -1);
  hazards.splice(hazards.indexOf(victim), 1);
}

/* Пустить в ход купленное — клавишами 1..3 или касанием ячеек внизу экрана */
function useItem(id){
  if(state !== "play" || paused || !inv[id]) return;
  if(id === "shield"){
    hero.shield = 5;
    Audio5.sfx("shield");
    say("ЩИТ!", hero.x, GROUND_Y-52, P.cyan, true);
    burst(hero.x, GROUND_Y-14, 16, 80, [P.cyan, P.bone, "#c7fff8"], -1);
  } else if(id === "life"){
    hero.lives = Math.min(6, hero.lives + 1);
    Audio5.sfx("heart");
    say("+1 ЖИЗНЬ", hero.x, GROUND_Y-52, P.magenta, true);
    burst(hero.x, GROUND_Y-14, 14, 70, [P.magenta, P.bone], -1);
  } else if(id === "x2"){
    x2Timer = 5;
    Audio5.sfx("shield");
    say("×2 ОЧКИ!", hero.x, GROUND_Y-52, P.orange, true);
    burst(hero.x, GROUND_Y-14, 18, 90, [P.orange, P.bone], -1);
  }
  inv[id]--;
  saveWallet();
}

/* Урон Ярику — от прилетевшего снаряда или от того, что лежит на земле */
function hurtHero(){
  // щит принимает удар на себя и на этом заканчивается
  if(hero.shield > 0){
    hero.shield = 0;
    hero.inv = 1.0;
    flash = 0.6;
    Audio5.sfx("shieldBreak");
    buzz(25);
    burst(hero.x, GROUND_Y-14, 22, 130, [P.cyan, P.bone, "#c7fff8"], 1);
    say("ЩИТ ДЕРЖИТ!", hero.x, GROUND_Y-44, P.cyan, true);
    return;
  }
  hero.lives--;
  hero.inv = 1.6;
  flash = 1;
  dodgeStreak = 0;
  Audio5.sfx("hurt");
  buzz(hero.lives > 0 ? 45 : [60,50,90]);
  burst(hero.x, GROUND_Y-14, 18, 120, [P.magenta, P.bone, P.shirt], 1);
  say(hero.lives > 0 ? "АЙ!" : "ОЙ-Й!", hero.x, GROUND_Y-40, P.magenta);
  if(hero.lives <= 0) gameOver();
}

function land(rk){
  const big = rk.kind === "boulder";
  const hitR = hitRadiusOf(rk);
  const dist = Math.abs(hero.x - rk.tx);
  const inZone = dist < hitR;

  shake = Math.max(shake, big ? 9 : 5);
  craters.push({
    x: rk.tx, r: big?15:9, life: 5,
    stuck: curBoss().id === "strelok" && !big,     // стрела остаётся торчать
    tilt: rnd(-0.5, 0.5)
  });

  // снежок не разбивается: комом лежит на земле и мешает бегать
  if(curBoss().id === "snegovik"){
    const r = big ? 15 : 11;
    if(canDropSnow(rk.tx, r)){
      hazards.push({
        x: rk.tx, r, life: 2, max: 2,
        // если ком лёг прямо на Ярика, удар уже засчитан снарядом — второй раз не бьём
        spent: Math.abs(hero.x - rk.tx) < r + 4
      });
    }
  }
  burst(rk.tx, GROUND_Y, big?26:14, big?150:105, curBoss().shot.dust, 1);
  Audio5.sfx(big ? curBoss().sfx.big : curBoss().sfx.land);

  if(state !== "play") return;

  if(inZone && hero.inv <= 0){
    hurtHero();
  } else if(!inZone && rk.threat){
    // засчитываем только настоящий уход: камень шёл в Ярика, а он успел выйти
    dodgeStreak++;
    const bonus = Math.round((50 + Math.min(150, dodgeStreak*10)) * curDiff().mult * (x2Timer > 0 ? 2 : 1));
    score += bonus;
    Audio5.sfx("dodge");
    say("+"+bonus, hero.x, GROUND_Y-42, P.cyan);
    // хвалим по имени; у края поля подпись сдвигаем, чтобы длинное имя не срезало
    if(dodgeStreak === 5)  say((player || "ЯРИК") + " В УДАРЕ!",
                               clamp(hero.x, 78, W-78), GROUND_Y-58, P.orange, true);
    if(dodgeStreak === 12) say(curBoss().name + " В ЯРОСТИ!", W/2, 120, P.magenta, true);
  }
}

function spawnHeart(){
  // если жизни на исходе — чаще сердце, если и так полные — чаще щит
  const needLife = hero.lives < curDiff().lives;
  const kind = hero.shield > 0 ? "heart"
             : (Math.random() < (needLife ? 0.65 : 0.3) ? "heart" : "shield");
  hearts.push({x: rnd(50, W-50), y: -10, life: 9, kind});
}

let newRecord = false;
let earned = 0;               // монет заработано за последний бой
let x2Timer = 0;              // сколько ещё секунд действует двойной счёт
let sentState = "off";        // off | sending | sent | failed
let rankState = "idle";       // idle | loading | ok | fail
let rank = null;              // {place, total}

function gameOver(){
  state = "over";
  hero.alive = false;
  Audio5.duck(0.25, 2.2);
  Audio5.sfx("over");
  shake = 12;
  burst(hero.x, GROUND_Y-12, 30, 150, [P.shirt, P.hair, P.skin, P.magenta], 1);
  // монеты за продержанное время: чем выше сложность, тем чаще капают
  earned = Math.floor(runTime / curDiff().coinEvery);
  if(earned > 0){ coins += earned; saveWallet(); }

  const id = curDiff().id;
  newRecord = Math.floor(score) > bests[id].score;
  if(newRecord){
    bests[id] = {score: Math.floor(score), name: player};
    try { localStorage.setItem(bestKey(curBoss().id, id), JSON.stringify(bests[id])); } catch(e){}
  }

  // результат уходит в общую таблицу; молча, чтобы сеть не мешала игре
  if(cloudOn() && player && Math.floor(score) > 0){
    sentState = "sending";
    const mine = score;
    cloudSubmit(player, mine, id, runTime).then(ok => {
      sentState = ok ? "sent" : "failed";
      if(!ok) return;
      rankState = "loading";                    // место считаем после записи, чтобы учесть себя
      cloudRank(mine, id)
        .then(r => { rank = r; rankState = "ok"; })
        .catch(() => { rankState = "fail"; });
    });
  } else {
    sentState = "off";
  }
}

function reset(){
  runTime = 0; score = 0; wave = 1; dodgeStreak = 0; rageTimer = 0; heartTimer = 22;
  newRecord = false; earned = 0; x2Timer = 0; sentState = "off"; rankState = "idle"; rank = null;
  aimNow = 0; aimAnnounced = 0;
  hero.x = W/2; hero.vx = 0; hero.lives = curDiff().lives; hero.inv = 0; hero.alive = true; hero.walk = 0; hero.shield = 0;
  boss.x = W/2; boss.state = "wait"; boss.t = 0; boss.wait = 0.9; boss.pending = null; boss.roar = 0;
  rocks = []; parts = []; craters = []; texts = []; hearts = []; hazards = []; zoneReset();
  shake = 0; flash = 0; rageFlash = 0;
}

function startGame(){
  diffIndex = menuIndex;
  try { localStorage.setItem("gromila.diff", curDiff().id); } catch(e){}
  reset();
  state = "play";
  Audio5.unlock();
  if(Audio5.isEnabled()) Audio5.startMusic();
  Audio5.sfx("start");
  say(curDiff().name, W/2, 120, P.orange, true);
}

function toMenu(){
  state = "menu";
  menuIndex = diffIndex;
  rocks = []; texts = [];
  hero.x = W/2; hero.vx = 0; hero.inv = 0;
  Audio5.duck(1, 0.3);
}

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
let rageTimer = 0, heartTimer = 22;

function update(dt){
  time += dt;                                   // часы анимации идут всегда
  const d = difficulty();
  Audio5.setIntensity(state==="play" ? Math.min(1, d.k + (boss.roar>0?0.3:0)) : 0.05);

  if(state === "play"){
    runTime += dt;
    if(x2Timer > 0){
      x2Timer -= dt;
      if(x2Timer <= 0){ x2Timer = 0; say("×2 закончился", hero.x, GROUND_Y-40, "#8a6fa0"); }
    }
    score += dt * 10 * curDiff().mult * (x2Timer > 0 ? 2 : 1);
  }

  // герой
  const left  = keys["ArrowLeft"] || keys["KeyA"] || pressed.left;
  const right = keys["ArrowRight"] || keys["KeyD"] || pressed.right;
  const speed = 152;
  let target = 0;
  // зажаты обе — слушаем ту, что нажали последней: так удобнее менять
  // направление на бегу, не отпуская первый палец
  if(left && right)      target = (lastPress === "left" ? -speed : speed);
  else if(left)          target = -speed;
  else if(right)         target =  speed;

  // палец на экране перебивает кнопки: бежим к точке касания и тормозим на месте
  if(touchX !== null && !left && !right){
    const dx = touchX - hero.x;
    if(Math.abs(dx) > 3) target = clamp(dx*9, -speed, speed);
  }

  // в меню стрелки заняты выбором соперника, Ярик там стоит и ждёт
  if(state === "over" || state === "menu") target = 0;

  hero.vx += (target - hero.vx) * Math.min(1, dt*16);
  if(Math.abs(hero.vx) < 1) hero.vx = 0;
  const loX = zoneMinX(), hiX = zoneMaxX();      // стены зоны, если они сошлись
  hero.x = clamp(hero.x + hero.vx*dt, loX, hiX);
  if(hero.x <= loX || hero.x >= hiX) hero.vx *= 0.2;
  if(target !== 0) hero.dir = target > 0 ? 1 : -1;
  hero.walk += Math.abs(hero.vx)/speed * dt;
  if(hero.inv > 0) hero.inv -= dt;
  if(hero.shield > 0 && state === "play"){
    hero.shield -= dt;
    if(hero.shield <= 0){ hero.shield = 0; say("щит погас", hero.x, GROUND_Y-40, "#8a6fa0"); }
  }

  // босс: бродит и швыряет
  boss.x += boss.drift * dt * (11 + d.k*9);
  if(boss.x > W-90){ boss.x = W-90; boss.drift = -1; }
  if(boss.x < 90)  { boss.x = 90;  boss.drift =  1; }
  if(Math.random() < dt*0.25) boss.drift *= -1;

  if(boss.recoil > 0) boss.recoil = Math.max(0, boss.recoil - dt*22);
  if(boss.roar > 0)   boss.roar -= dt;

  boss.t += dt;
  if(boss.state === "wait" && boss.t >= boss.wait && state !== "over"){
    boss.state = "windup"; boss.t = 0; boss.pending = planThrow();
  } else if(boss.state === "windup" && boss.t >= WINDUP){
    boss.state = "throw"; boss.t = 0; releaseThrow(boss.pending); boss.pending = null;
  } else if(boss.state === "throw" && boss.t >= 0.22){
    boss.state = "wait"; boss.t = 0;
    boss.wait = d.gap * rnd(0.75, 1.3) * (state === "play" ? 1 : 1.7);
  }

  // пристрелка: предупреждаем, когда манера броска меняется
  if(state === "play"){
    aimNow = clamp(d.k * curDiff().aim, 0, 1);
    if(aimAnnounced < 1 && aimNow > 0.45){
      aimAnnounced = 1;
      say(curBoss().name + " ПРИЦЕЛИЛСЯ", W/2, H*0.34, P.magenta, true);
      Audio5.sfx("roar");
      boss.roar = 0.8; rageFlash = 0.6;
    }
    if(aimAnnounced < 2 && aimNow > 0.9){
      aimAnnounced = 2;
      say("НЕ БЕГИ ПО ПРЯМОЙ!", W/2, H*0.34, P.orange, true);
    }
  }

  // приступ ярости
  if(state === "play"){
    rageTimer += dt;
    if(rageTimer > 24){
      rageTimer = 0;
      boss.roar = 1.1; rageFlash = 0.8; shake = Math.max(shake, 6);
      Audio5.sfx("roar");
      say(curBoss().name + " В ЯРОСТИ!", W/2, 108, P.magenta, true);
      boss.wait = Math.min(boss.wait, 0.35);
    }
    heartTimer -= dt;
    if(heartTimer <= 0){
      heartTimer = rnd(24, 38);
      if(hero.lives < 4) spawnHeart();
    }
  }

  // камни
  for(let i=rocks.length-1;i>=0;i--){
    const rk = rocks[i];
    rk.t += dt;
    rk.rot += rk.spin*dt;
    rockAt(rk);
    /* Уворот — это уход от снаряда, который летел именно в тебя. Поэтому
       угрозу отмечаем в начале полёта: если Ярик стоял в точке падения,
       когда снаряд только вышел из руки, значит целились в него. Пробежать
       через чужую воронку по дороге — не подвиг и серию не даёт. */
    if(state === "play" && hero.inv <= 0 && !rk.threat &&
       rk.t / rk.dur < 0.3 &&
       Math.abs(hero.x - rk.tx) < hitRadiusOf(rk)){
      rk.threat = true;
    }
    if(rk.t >= rk.dur){ land(rk); rocks.splice(i,1); }
  }

  // сердечки
  for(let i=hearts.length-1;i>=0;i--){
    const ht = hearts[i];
    ht.y = Math.min(GROUND_Y-30, ht.y + 42*dt);
    ht.life -= dt;
    if(Math.abs(ht.x - hero.x) < 12 && ht.y > GROUND_Y-46 && state === "play"){
      if(ht.kind === "shield"){
        hero.shield = 5;                       // держится пять секунд или до первого удара
        Audio5.sfx("shield");
        say("ЩИТ!", hero.x, GROUND_Y-52, P.cyan, true);
        burst(ht.x, ht.y, 16, 80, [P.cyan, P.bone, "#c7fff8"], -1);
      } else {
        hero.lives = Math.min(5, hero.lives+1);
        Audio5.sfx("heart");
        say("+1 ЖИЗНЬ", hero.x, GROUND_Y-52, P.magenta, true);
        burst(ht.x, ht.y, 14, 70, [P.magenta, P.bone], -1);
      }
      hearts.splice(i,1); continue;
    }
    if(ht.life <= 0) hearts.splice(i,1);
  }

  // частицы, воронки, тексты
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.vy += 260*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.y > GROUND_Y){ p.y = GROUND_Y; p.vy *= -0.35; p.vx *= 0.6; }
    p.life -= dt;
    if(p.life <= 0) parts.splice(i,1);
  }
  for(let i=craters.length-1;i>=0;i--){ craters[i].life -= dt; if(craters[i].life<=0) craters.splice(i,1); }

  // лежащие комья: наступил — получил, но каждый ком бьёт только раз
  for(let i=hazards.length-1;i>=0;i--){
    const hz = hazards[i];
    hz.life -= dt;
    if(state === "play" && !hz.spent && hero.inv <= 0 &&
       Math.abs(hero.x - hz.x) < snowHitR(hz.r)){
      hz.spent = true;
      burst(hz.x, GROUND_Y-4, 14, 90, curBoss().shot.dust, 1);
      hurtHero();
    }
    if(hz.life <= 0) hazards.splice(i,1);
  }
  freeTheLane();
  zoneStep(dt);
  for(let i=texts.length-1;i>=0;i--){ texts[i].life -= dt; texts[i].y -= dt*14; if(texts[i].life<=0) texts.splice(i,1); }

  shake = Math.max(0, shake - dt*26);
  flash = Math.max(0, flash - dt*3);
  rageFlash = Math.max(0, rageFlash - dt*1.6);
}

/* ============================================================
   ОТРИСОВКА МИРА
   ============================================================ */
function render(){
  g.save();
  if(shake > 0.2) g.translate(Math.round(rnd(-shake,shake)*0.5), Math.round(rnd(-shake,shake)*0.35));

  drawSky();
  drawBoss();
  drawGround();
  drawWeather();

  // воронки
  for(const c of craters){
    const a = clamp(c.life/5, 0, 1);
    g.globalAlpha = a*0.6;
    disc(c.x, GROUND_Y+1, c.r, T.crater[0]);
    disc(c.x, GROUND_Y, Math.max(1,c.r-3), T.crater[1]);
    g.globalAlpha = 1;
    if(c.stuck){                        // воткнувшаяся стрела торчит из земли
      g.globalAlpha = a;
      drawShot(c.x + Math.sin(c.tilt)*6, GROUND_Y - 7, 6, 1,
               {dir: -Math.PI/2 + c.tilt});
      g.globalAlpha = 1;
    }
  }

  // стены сужающейся зоны — от линии горизонта до низа экрана
  if(zone.phase !== "idle"){
    const top = HORIZON_Y;
    if(zone.phase === "warn"){
      // за три секунды до схождения пунктиром показываем, где встанут стены
      g.globalAlpha = 0.4 + Math.abs(Math.sin(time*7))*0.55;
      for(const x of [zone.toL, zone.toR])
        for(let y = top; y < H; y += 7) px(x-1, y, 3, 4, T.markHot);
      g.globalAlpha = 1;
    } else {
      g.globalAlpha = 0.62;                       // снаружи гасим свет
      px(0, top, Math.max(0, zone.l), H-top, T.chasm);
      px(zone.r, top, Math.max(0, W-zone.r), H-top, T.chasm);
      // барьер: широкое свечение, яркая кромка и бегущие штрихи по ней
      g.globalAlpha = 0.3;
      px(zone.l-9, top, 8, H-top, T.markHot);
      px(zone.r+1, top, 8, H-top, T.markHot);
      g.globalAlpha = 0.85 + Math.sin(time*9)*0.15;
      px(zone.l-3, top, 4, H-top, T.markHot);
      px(zone.r, top, 4, H-top, T.markHot);
      g.globalAlpha = 0.9;
      for(let y = top + ((time*26)%10); y < H; y += 10){
        px(zone.l-3, y, 4, 3, "#ffe6ef");
        px(zone.r, y, 4, 3, "#ffe6ef");
      }
      g.globalAlpha = 1;
    }
  }

  // комья снега на земле — по ним видно, куда не стоит бежать
  for(const hz of hazards){
    const t = clamp(hz.life/hz.max, 0, 1);
    const fading = hz.life < 0.6 && Math.floor(hz.life*10) % 2 === 0;
    if(fading) continue;
    const S = curBoss().shot;
    g.globalAlpha = 0.35;
    disc(hz.x, GROUND_Y+2, hz.r, T.shade);
    g.globalAlpha = 1;
    const r = Math.max(3, Math.round(hz.r*(0.7 + t*0.3)));
    disc(hz.x, GROUND_Y - r*0.35, r, S.lo);
    disc(hz.x - 1, GROUND_Y - r*0.5, Math.max(2, r-2), S.main);
    px(hz.x - r*0.5, GROUND_Y - r*0.9, Math.max(1, r*0.4), Math.max(1, r*0.3), S.hi);
    g.globalAlpha = 0.5 + Math.sin(time*8)*0.2;
    ring(hz.x, GROUND_Y+2, r+3, (r+3)*0.34, T.markHot, 1);
    g.globalAlpha = 1;
  }

  // маркеры падения
  for(const rk of rocks){
    const t = clamp(rk.t/rk.dur, 0, 1);
    const big = rk.kind === "boulder";
    const R = (big?26:14) * (0.45 + t*0.55);
    const hot = t > 0.68;
    // прицельный бросок помечен особым цветом сразу — предупреждение честное
    const col = hot ? T.markHot : (big ? T.markBig : (rk.pin ? T.markAim : T.markCold));
    g.globalAlpha = 0.22 + t*0.3;
    g.fillStyle = col;
    g.beginPath(); g.ellipse(rk.tx, GROUND_Y+2, R, R*0.34, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 0.55 + t*0.45;
    ring(rk.tx, GROUND_Y+2, R, R*0.34, col, hot ? 2 : 1);
    if(hot){
      g.globalAlpha = 0.5 + Math.sin(time*26)*0.4;
      ring(rk.tx, GROUND_Y+2, R*0.55, R*0.19, P.bone, 1);
    }
    g.globalAlpha = 1;
  }

  // падающие подарки: сердце и щит — теми же спрайтами, что и в шапке
  for(const ht of hearts){
    const blink = ht.life < 3 && Math.floor(ht.life*8)%2 === 0;
    if(blink) continue;
    const y = ht.y + Math.sin(time*5)*2;
    const shield = ht.kind === "shield";
    g.globalAlpha = 0.5;
    disc(ht.x, y+7, 5, T.shade);
    g.globalAlpha = 1;
    paintSprite(g, shield ? SHIELD : HEART, Math.round(ht.x-4), Math.round(y-4), 1,
      shield ? P.cyan   : P.magenta,
      shield ? "#0f5f58" : "#7a1030",
      shield ? "#c7fff8" : "#ff9ec2");
  }

  // камни в полёте
  for(const rk of rocks){
    g.globalAlpha = 0.25;
    disc(rk.x+2, rk.y+3, Math.max(2, rk.r*rk.sc*0.9), T.shade);
    g.globalAlpha = 1;
    drawShot(rk.x, rk.y, rk.r, rk.sc, rk);
  }

  drawHero();

  // частицы
  for(const p of parts){
    g.globalAlpha = clamp(p.life/p.max, 0, 1);
    px(p.x, p.y, p.s, p.s, p.c);
  }
  g.globalAlpha = 1;

  // вспышки
  if(rageFlash > 0){ g.globalAlpha = rageFlash*0.22; px(0,0,W,H,P.magenta); g.globalAlpha = 1; }
  if(flash > 0){ g.globalAlpha = flash*0.4; px(0,0,W,H,"#ff3355"); g.globalAlpha = 1; }

  g.restore();

  // всплывающие подписи — в мире, но текстом
  for(const t of texts){
    const a = clamp(t.life/(t.big?1.6:1.1), 0, 1);
    g.globalAlpha = a;
    g.font = (t.big ? "bold 11px " : "bold 8px ") + "monospace";
    g.textAlign = "center";
    g.fillStyle = "#160c22";
    g.fillText(t.text, (t.x|0)+1, (t.y|0)+1);
    g.fillStyle = t.color;
    g.fillText(t.text, t.x|0, t.y|0);
    g.globalAlpha = 1;
  }
}

/* ============================================================
   ИНТЕРФЕЙС (чёткий слой 960x540)
   ============================================================ */
/* На телефоне холст интерфейса ужимается с 960 px до ширины экрана, поэтому
   шрифты укрупняем обратно — иначе подписи превращаются в нечитаемую мелочь. */
let uiK = 1;
function computeUiScale(){
  const w = screenEl.getBoundingClientRect().width || 960;
  uiK = clamp(640 / Math.max(240, w), 1, 1.75);
}

function text(str, x, y, size, color, align, weight){
  size = Math.round(size * uiK);
  u.font = (weight||"bold") + " " + size + "px " + "ui-monospace, Consolas, 'Courier New', monospace";
  u.textAlign = align || "left";
  u.textBaseline = "alphabetic";
  u.fillStyle = "rgba(10,5,18,.75)";
  u.fillText(str, x+3, y+3);
  u.fillStyle = color;
  u.fillText(str, x, y);
}
function chromaText(str, x, y, size){
  size = Math.round(size * Math.min(uiK, 1.25));   // крупный заголовок и так широкий
  const face = "px ui-monospace, Consolas, 'Courier New', monospace";
  u.textAlign = "center";
  // ужимаем, пока заголовок не влезет в экран — на телефоне длинные фразы иначе обрезаются
  do {
    u.font = "bold " + size + face;
    if(u.measureText(str).width <= uiC.width - 40) break;
    size -= 2;
  } while(size > 12);
  u.fillStyle = P.magenta; u.fillText(str, x-3, y);
  u.fillStyle = P.cyan;    u.fillText(str, x+3, y);
  u.fillStyle = P.bone;    u.fillText(str, x, y);
}
/* мягкая тёмная лента, чтобы текст читался поверх мира */
function scrim(top, bottom, strength){
  const gr = u.createLinearGradient(0, top, 0, bottom);
  gr.addColorStop(0,    "rgba(10,5,18,0)");
  gr.addColorStop(0.18, "rgba(10,5,18," + strength + ")");
  gr.addColorStop(0.82, "rgba(10,5,18," + strength + ")");
  gr.addColorStop(1,    "rgba(10,5,18,0)");
  u.fillStyle = gr;
  u.fillRect(0, top, uiC.width, bottom-top);
}
/* Главная кнопка: заметная заливка, тёмный текст, лёгкое дыхание —
   чтобы взгляд сразу находил, куда нажимать. */
function bigButton(label, y, rect, size){
  const CW = uiC.width;
  const pulse = 1 + Math.sin(time*3.4)*0.02;
  const h = Math.round(size*uiK*2.2);
  u.font = "bold " + Math.round(size*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
  const w = Math.min(CW - 48, Math.max(u.measureText(label).width + 80*uiK, 260*uiK)) * pulse;
  rect.x = CW/2 - w/2; rect.y = y - h/2; rect.w = w; rect.h = h;

  u.fillStyle = "rgba(55,230,212,.16)";
  u.fillRect(rect.x-3, rect.y-3, rect.w+6, rect.h+6);
  u.fillStyle = P.cyan;
  u.fillRect(rect.x, rect.y, rect.w, rect.h);
  u.fillStyle = "#0a0512";
  u.textAlign = "center";
  u.fillText(label, CW/2, rect.y + rect.h*0.68);
}

function heartIcon(x, y, s, filled){
  paintSprite(u, HEART, x, y, s,
    filled ? P.magenta : "rgba(246,231,193,.16)",
    filled ? "#7a1030" : "rgba(246,231,193,.10)",
    filled ? "#ff9ec2" : null);
}

const menuRects = [];
const nickRect = {x:0, y:0, w:0, h:0};
const boardRect = {x:0, y:0, w:0, h:0};
const bossRect = {x:0, y:0, w:0, h:0};
const boardBossRect = {x:0, y:0, w:0, h:0};
const boardDiffRect = {x:0, y:0, w:0, h:0};
const playRect = {x:0, y:0, w:0, h:0};
const shopRect = {x:0, y:0, w:0, h:0};
const titleRect = {x:0, y:0, w:0, h:0};
const slotRects = [];
const shopRows = [];

function drawUI(){
  u.clearRect(0,0,uiC.width,uiC.height);

  const CW = uiC.width, CH = uiC.height, cx = CW/2;
  const narrow = CW < 900;                      // телефон в портрете

  if(state === "play" || state === "over"){
    const hs = Math.max(3, Math.round(2.6*uiK));          // размер сердечка
    const row1 = Math.round(20 + 22*uiK);
    const row2 = row1 + Math.round(21*uiK);
    const slots = Math.max(curDiff().lives, hero.lives);
    // сердце занимает 8 клеток, между ними — две клетки воздуха
    for(let i=0;i<slots;i++) heartIcon(20 + i*hs*10, row1 - hs*7, hs, i < hero.lives);
    // щит стоит рядом с сердцами и показывает, сколько ему осталось
    if(hero.shield > 0){
      const sx = 20 + slots*hs*10 + hs*4, sy = row1 - hs*7;
      paintSprite(u, SHIELD, sx, sy, hs, P.cyan, "#0f5f58", "#c7fff8");
      u.fillStyle = "rgba(55,230,212,.35)";
      u.fillRect(sx, sy + hs*8, hs*8, hs);
      u.fillStyle = P.cyan;
      u.fillRect(sx, sy + hs*8, hs*8 * clamp(hero.shield/5, 0, 1), hs);
    }
    text("ОЧКИ " + String(Math.floor(score)).padStart(6,"0"), CW-20, row1, narrow ? 17 : 22, P.bone, "right");

    if(narrow){
      // на узком экране волна, сложность и время идут одной строкой под шапкой
      text(curBoss().name + " · " + curDiff().name + " · ВОЛНА " + wave + " · " + runTime.toFixed(1) + "с",
           cx, row2, 12, P.cyan, "center");
    } else {
      text("ВОЛНА " + wave + "  ·  " + curBoss().name + "  ·  " + curDiff().name,
           cx, row1-4, 18, P.cyan, "center");
      text("ВРЕМЯ " + runTime.toFixed(1) + "с", cx, row2, 13, "#a98cc0", "center");
    }
    if(dodgeStreak > 2) text("СЕРИЯ ×" + dodgeStreak, CW-20, row2 + (narrow?Math.round(18*uiK):6), narrow?12:14, P.orange, "right");
    if(x2Timer > 0) text("×2  " + x2Timer.toFixed(1) + "с", CW-20, row1 - Math.round(24*uiK), 15, P.orange, "right");

    /* Ячейки купленного стоят под шапкой, а не внизу: там они не заслоняют
       Ярика, но остаются в удобной для пальца зоне. */
    const cw = Math.round(82*uiK), chh = Math.round(58*uiK), gap = Math.round(10*uiK);
    const bx0 = 20, by0 = row2 + Math.round(14*uiK);
    slotRects.length = 0;
    for(let i=0;i<SHOP.length;i++){
      const it = SHOP[i], have = inv[it.id];
      const x = bx0 + i*(cw+gap);
      const tint = it.id === "shield" ? P.cyan : it.id === "life" ? P.magenta : P.orange;
      slotRects.push({x, y:by0, w:cw, h:chh, id:it.id});

      u.fillStyle = "rgba(10,5,18,.86)";           // плотная подложка — читается на любом фоне
      u.fillRect(x, by0, cw, chh);
      if(have){                                     // есть запас — ячейка светится
        u.fillStyle = "rgba(255,255,255,.05)";
        u.fillRect(x+2, by0+2, cw-4, chh-4);
      }
      u.lineWidth = have ? 3 : 2;
      u.strokeStyle = have ? tint : "rgba(246,231,193,.18)";
      u.strokeRect(x + u.lineWidth/2, by0 + u.lineWidth/2, cw - u.lineWidth, chh - u.lineWidth);

      const s = Math.max(3, Math.round(3.4*uiK));
      const iconY = by0 + Math.round(chh*0.16);
      if(it.id === "shield")
        paintSprite(u, SHIELD, x + cw/2 - s*4, iconY, s,
                    have ? P.cyan : "rgba(246,231,193,.22)", have ? "#0f5f58" : null, have ? "#c7fff8" : null);
      else if(it.id === "life")
        paintSprite(u, HEART, x + cw/2 - s*4, iconY, s,
                    have ? P.magenta : "rgba(246,231,193,.22)", have ? "#7a1030" : null, have ? "#ff9ec2" : null);
      else
        text("×2", x + cw/2, iconY + s*5.6, 26, have ? P.orange : "rgba(246,231,193,.22)", "center");

      // номер клавиши и остаток — крупно, каждый в своём углу
      text(String(i+1), x + 7, by0 + Math.round(16*uiK), 13, "#8a6fa0", "left");
      u.fillStyle = have ? tint : "rgba(246,231,193,.10)";
      u.fillRect(x + cw - Math.round(22*uiK), by0 + chh - Math.round(20*uiK),
                 Math.round(20*uiK), Math.round(18*uiK));
      text(String(have), x + cw - Math.round(12*uiK), by0 + chh - Math.round(6*uiK),
           14, have ? "#0a0512" : "#6d5580", "center");
    }
  }

  if(state === "menu"){
    u.fillStyle = "rgba(10,5,18,.34)";
    u.fillRect(0,0,CW,CH);
    scrim(CH*0.07, CH*0.97, 0.82);

    const pulse = 1 + Math.sin(time*3)*0.018;
    u.save();
    u.translate(cx, CH*0.20);
    u.scale(pulse, pulse);
    chromaText("ГРОМИЛА", 0, 0, 66);
    u.restore();
    // невидимая зона: долгое удержание заголовка выдаёт монеты
    titleRect.w = Math.min(CW*0.7, 420*uiK); titleRect.h = Math.round(70*uiK);
    titleRect.x = cx - titleRect.w/2;        titleRect.y = CH*0.20 - titleRect.h*0.75;
    // подзаголовок называет того, кто играет, и того, против кого
    text(((player || "ЯРИК") + " ПРОТИВ " + curBoss().vs).toUpperCase(),
         cx, CH*0.256, narrow ? 13 : 16, P.orange, "center");

    // строка игрока — по ней же меняют имя
    const nickLine = (player || "без имени") + "   ✎";
    const nickY = CH*0.312;
    u.font = "bold " + Math.round(15*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
    const nickW = u.measureText(nickLine).width;
    nickRect.x = cx - nickW/2 - 14;
    nickRect.y = nickY - Math.round(17*uiK);
    nickRect.w = nickW + 28;
    nickRect.h = Math.round(25*uiK);
    u.fillStyle = "rgba(55,230,212,.07)";
    u.fillRect(nickRect.x, nickRect.y, nickRect.w, nickRect.h);
    text(nickLine, cx, nickY, 15, P.cyan, "center");

    // выбор соперника — стрелками или касанием краёв строки
    const bossLine = "◀   " + curBoss().name + "   ▶";
    const bossY = CH*0.363;
    u.font = "bold " + Math.round(20*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
    const bw2 = Math.max(u.measureText(bossLine).width, 200*uiK);
    bossRect.x = cx - bw2/2 - 16; bossRect.y = bossY - Math.round(22*uiK);
    bossRect.w = bw2 + 32;        bossRect.h = Math.round(30*uiK);
    u.fillStyle = "rgba(255,139,61,.09)";
    u.fillRect(bossRect.x, bossRect.y, bossRect.w, bossRect.h);
    text(bossLine, cx, bossY, 20, P.orange, "center");
    text(curBoss().hint, cx, bossY + Math.round(20*uiK), 11, "#9d84b4", "center", "normal");

    menuRects.length = 0;
    const wRow = Math.min(CW - 50, 440*uiK);
    const x0 = cx - wRow/2;
    /* Нижние подписи прибиты к краю экрана, строки сложности занимают то,
       что осталось — иначе при укрупнённом шрифте меню наезжает само на себя. */
    const yBottomHint = CH - 16;
    const yGo   = yBottomHint - 34*uiK;
    const yHint = yGo - 30*uiK;
    const yTop  = CH*0.435;
    // строки сложности делят то, что осталось выше кнопки таблицы
    const hRow  = Math.min(40*uiK, Math.max(20, (yHint - 62*uiK - yTop) / DIFFS.length));
    for(let i=0;i<DIFFS.length;i++){
      const d = DIFFS[i];
      const y = yTop + i*hRow;
      menuRects.push({x:x0, y, w:wRow, h:hRow-6, i});
      const on = i === menuIndex;
      if(on){
        u.fillStyle = "rgba(55,230,212,.12)";
        u.fillRect(x0, y, wRow, hRow-6);
        u.fillStyle = P.cyan;
        u.fillRect(x0, y, 4, hRow-6);
      }
      const baseline = y + hRow*0.62;
      text(on ? "▶ " + d.name : "  " + d.name, x0+18, baseline, 22, on ? P.bone : "#8f74a6", "left");
      const bs = bests[d.id];
      // рекорд подписан именем — видно, чей результат предстоит побить
      const mark = bs.score > 0
        ? (bs.name && bs.name.toUpperCase() !== (player||"").toUpperCase()
             ? bs.name + " " + bs.score          // сравниваем без учёта регистра, показываем как есть
             : String(bs.score))
        : "—";
      text(mark, x0+wRow-16, baseline, 15, on ? P.cyan : "#6d5580", "right",
           bs.score > 0 ? "bold" : "normal");
    }

    // вход в общую таблицу — полноценная кнопка, а не подпись
    // вход в лавку — с балансом прямо в строке
    const shopLine = "ЛАВКА ▸   " + coins + " ⬤";
    u.font = "bold " + Math.round(15*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
    const sw = Math.min(CW - 44, u.measureText(shopLine).width + 70*uiK);
    shopRect.x = cx - sw/2;           shopRect.y = yHint - Math.round(86*uiK);
    shopRect.w = sw;                  shopRect.h = Math.round(26*uiK);
    u.fillStyle = "rgba(255,139,61,.12)";
    u.fillRect(shopRect.x, shopRect.y, shopRect.w, shopRect.h);
    text(shopLine, cx, shopRect.y + shopRect.h*0.72, 15, P.orange, "center");

    const boardLine = "ТАБЛИЦА РЕКОРДОВ ▸";
    u.font = "bold " + Math.round(17*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
    const bw = Math.min(CW - 44, u.measureText(boardLine).width + 70*uiK);
    boardRect.x = cx - bw/2;          boardRect.y = yHint - Math.round(56*uiK);
    boardRect.w = bw;                 boardRect.h = Math.round(36*uiK);
    u.fillStyle = "rgba(255,139,61,.14)";
    u.fillRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h);
    u.strokeStyle = "rgba(255,139,61,.55)"; u.lineWidth = 1;
    u.strokeRect(boardRect.x+0.5, boardRect.y+0.5, boardRect.w-1, boardRect.h-1);
    text(boardLine, cx, boardRect.y + boardRect.h*0.68, 17, P.orange, "center");

    text(DIFFS[menuIndex].hint, cx, yHint, narrow?12:14, "#b79ccb", "center", "normal");
    bigButton("ИГРАТЬ  ▶", yGo, playRect, 20);

    text(coarse ? "веди пальцем — Ярик бежит за ним   ·   имя сверху меняется"
               : "↑ ↓ — выбор   ·   N — имя   ·   T — таблица   ·   M — звук",
         cx, yBottomHint, 12, "#6d5580", "center", "normal");
  }

  if(state === "board"){
    u.fillStyle = "rgba(10,5,18,.4)";
    u.fillRect(0,0,CW,CH);
    scrim(CH*0.06, CH*0.97, 0.86);

    chromaText("ТАБЛИЦА РЕКОРДОВ", cx, CH*0.12, 40);

    // две переключаемые строки: соперник и сложность
    const rowLine = (label, y, rect, color, size) => {
      const line = "◀   " + label + "   ▶";
      u.font = "bold " + Math.round(size*uiK) + "px ui-monospace, Consolas, 'Courier New', monospace";
      // зона касания заметно шире надписи — попасть пальцем должно быть легко
      const w = Math.min(CW - 40, Math.max(u.measureText(line).width + 90, 320*uiK));
      rect.x = cx - w/2;      rect.y = y - Math.round(size*uiK*1.25);
      rect.w = w;             rect.h = Math.round(size*uiK*1.9);
      u.fillStyle = "rgba(246,231,193,.05)";
      u.fillRect(rect.x, rect.y, rect.w, rect.h);
      text(line, cx, y, size, color, "center");
    };
    rowLine(BOSSES[board.boss].name, CH*0.19,  boardBossRect, P.bone, 19);
    rowLine(DIFFS[board.diff].name,  CH*0.248, boardDiffRect, P.orange, 17);
    if(cloudHasBoss === false)
      text("в базе общий зачёт — соперники не разделены", cx, CH*0.268, 11, "#8a6fa0", "center", "normal");

    const top = CH*0.30, rowH = Math.min(32*uiK, (CH*0.82 - top)/10);
    if(board.status === "loading"){
      const dots = ".".repeat(1 + (Math.floor(time*3) % 3));
      text("загружаем" + dots, cx, CH*0.45, 18, "#b79ccb", "center", "normal");
    } else if(board.status === "error"){
      text(board.error, cx, CH*0.44, 18, P.magenta, "center");
      text(cloudOn() ? "проверь интернет и попробуй ещё раз"
                     : "в коде игры не заполнены адрес и ключ",
           cx, CH*0.50, 13, "#8a6fa0", "center", "normal");
    } else if(!board.rows.length){
      text("пока пусто", cx, CH*0.44, 20, "#8a6fa0", "center");
      text("первый результат может быть твоим", cx, CH*0.50, 13, "#b79ccb", "center", "normal");
    } else {
      const wRow = Math.min(CW - 60, 460*uiK);
      const x0 = cx - wRow/2;
      for(let i=0;i<board.rows.length;i++){
        const r = board.rows[i];
        const y = top + i*rowH;
        const mine = player && String(r.name).toUpperCase() === player.toUpperCase();
        if(mine){
          u.fillStyle = "rgba(55,230,212,.10)";
          u.fillRect(x0, y, wRow, rowH-4);
        }
        const bl = y + rowH*0.68;
        const col = i === 0 ? P.orange : (mine ? P.cyan : "#c7aede");
        text(String(i+1).padStart(2," "), x0+14, bl, 15, i===0?P.orange:"#6d5580", "left");
        text(String(r.name || "—"), x0+58, bl, 16, col, "left");
        text(String(r.score), x0+wRow-14, bl, 16, col, "right");
      }
    }
    text(coarse ? "коснись строки — сменить   ·   мимо строк — назад"
                : "← → — сложность   ·   ↑ ↓ — соперник   ·   ESC — назад",
         cx, CH-16, 12, "#6d5580", "center", "normal");
  }

  if(state === "shop"){
    u.fillStyle = "rgba(10,5,18,.42)";
    u.fillRect(0,0,CW,CH);
    scrim(CH*0.06, CH*0.97, 0.86);
    chromaText("ЛАВКА", cx, CH*0.14, 44);
    text("МОНЕТ: " + coins, cx, CH*0.205, 20, P.orange, "center");

    shopRows.length = 0;
    const wRow = Math.min(CW - 50, 470*uiK);
    const x0 = cx - wRow/2;
    const hRow = Math.min(64*uiK, (CH*0.76 - CH*0.25)/SHOP.length);
    for(let i=0;i<SHOP.length;i++){
      const it = SHOP[i];
      const y = CH*0.25 + i*hRow;
      const on = i === shopIndex;
      const canBuy = coins >= it.price;
      shopRows.push({x:x0, y, w:wRow, h:hRow-6, i});
      if(on){
        u.fillStyle = "rgba(55,230,212,.12)";
        u.fillRect(x0, y, wRow, hRow-6);
        u.fillStyle = P.cyan;
        u.fillRect(x0, y, 4, hRow-6);
      }
      text((on ? "▶ " : "  ") + it.name, x0+20, y + hRow*0.42, 19,
           on ? P.bone : "#8f74a6", "left");
      text(it.hint, x0+20, y + hRow*0.72, 11, "#9d84b4", "left", "normal");
      text(it.price + " ⬤", x0+wRow-16, y + hRow*0.42, 16,
           canBuy ? P.orange : "#6d5580", "right");
      text("в запасе " + inv[it.id], x0+wRow-16, y + hRow*0.72, 11, "#8a6fa0", "right", "normal");
    }

    text(coins >= SHOP[shopIndex].price ? "хватает — можно брать" : "монет не хватает",
         cx, CH*0.83, 13, coins >= SHOP[shopIndex].price ? P.cyan : P.magenta, "center", "normal");
    text(coarse ? "коснись товара — купить   ·   мимо — назад"
                : "↑ ↓ — выбор   ·   ПРОБЕЛ — купить   ·   ESC — назад",
         cx, CH-16, 12, "#6d5580", "center", "normal");
  }

  if(paused){
    u.fillStyle = "rgba(10,5,18,.72)";
    u.fillRect(0,0,CW,CH);
    chromaText("ПАУЗА", cx, CH*0.48, 56);
    text(coarse ? "коснись экрана, чтобы продолжить" : "нажми пробел, чтобы продолжить",
         cx, CH*0.58, narrow?13:18, P.cyan, "center", "normal");
  }

  if(state === "over"){
    u.fillStyle = "rgba(10,5,18,.4)";
    u.fillRect(0,0,CW,CH);
    scrim(CH*0.26, CH*0.89, 0.84);
    chromaText(curBoss().name + " ПОБЕДИЛ", cx, CH*0.37, 44);
    text("ОЧКИ  " + Math.floor(score), cx, CH*0.50, 30, P.bone, "center");
    text(narrow ? runTime.toFixed(1) + " с · ВОЛНА " + wave + " · " + curDiff().name
               : "ПРОДЕРЖАЛСЯ  " + runTime.toFixed(1) + " с  ·  ВОЛНА " + wave + "  ·  " + curDiff().name,
         cx, CH*0.565, narrow?12:16, "#b79ccb", "center", "normal");
    text(newRecord ? (player ? "НОВЫЙ РЕКОРД, " + player + "!" : "НОВЫЙ РЕКОРД!")
                   : "РЕКОРД  " + bests[curDiff().id].score,
         cx, CH*0.615, 20, newRecord ? P.orange : "#8a6fa0", "center");
    text(earned > 0 ? "+" + earned + " ⬤   ВСЕГО " + coins : "монет не заработал",
         cx, CH*0.663, 15, earned > 0 ? P.orange : "#6d5580", "center");
    // место в общем зачёте — главное, что хочется увидеть после боя
    if(rankState === "ok" && rank && rank.place){
      const first = rank.place === 1;
      text(first ? "ТЫ ПЕРВЫЙ ИЗ " + rank.total + "!"
                 : "ТЫ " + rank.place + "-й ИЗ " + rank.total,
           cx, CH*0.695, first ? 22 : 20, first ? P.orange : P.cyan, "center");
    } else if(rankState === "ok"){
      text("результат записан", cx, CH*0.69, 12, "#8a6fa0", "center", "normal");
    } else if(sentState !== "off"){
      const msg = sentState === "sending"      ? "отправляем в общую таблицу…"
                : rankState === "loading"      ? "считаем место…"
                : rankState === "fail"         ? "результат записан, место не сосчиталось"
                : sentState === "failed"       ? "не удалось отправить — таблица недоступна"
                                               : "результат в общей таблице";
      text(msg, cx, CH*0.69, 12, sentState === "failed" ? P.magenta : "#8a6fa0", "center", "normal");
    }
    bigButton("ЕЩЁ РАЗ  ▶", CH*0.775, playRect, 20);
    text(coarse ? "кнопка «Меню» — сменить сложность" : "ESC — выбрать сложность",
         cx, CH*0.84, narrow?12:16, "#8a6fa0", "center", "normal");
  }
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000;
  last = now;
  if(dt > 0.05) dt = 0.05;      // после сворачивания вкладки не «телепортируем» мир
  if(!paused) update(dt);
  render();
  drawUI();
  requestAnimationFrame(frame);
}

/* свернули браузер посреди боя — замираем, чтобы не потерять жизни вслепую */
document.addEventListener("visibilitychange", () => {
  if(document.hidden && state === "play"){
    paused = true;
    touchX = null;
    pressed.left = pressed.right = false;
    for(const k in keys) keys[k] = false;
    Audio5.stopMusic();
  }
});
function resume(){
  if(!paused) return;
  paused = false;
  last = performance.now();
  if(Audio5.isEnabled()) Audio5.startMusic();
}

/* ============================================================
   ВВОД
   ============================================================ */
/* ============================================================
   ИМЯ ИГРОКА
   ============================================================ */
const gateEl = document.getElementById("nameGate");
const nickInput = document.getElementById("nickInput");
const gateNote = document.querySelector(".gate-note");
const gateNoteDefault = gateNote.textContent;
let nameOpen = false;

function openNameGate(clear){
  nameOpen = true;
  gateEl.hidden = false;
  nickInput.value = clear ? "" : player;
  // без задержки мобильные браузеры игнорируют фокус и клавиатура не всплывает
  setTimeout(() => { nickInput.focus(); nickInput.select(); }, 60);
}
/* Возвращает false, если имя не приняли — окно остаётся открытым */
function closeNameGate(save){
  if(save){
    const typed = nickInput.value.replace(/\s+/g, " ").trim().slice(0,12);
    if(!typed) return false;          // без имени не выпускаем: в таблице оно обязано быть своим
    player = typed;
    try { localStorage.setItem("gromila.name", player); } catch(e){}
    updateMarquee();
  }
  nameOpen = false;
  gateEl.hidden = true;
  nickInput.blur();
  return true;
}
document.getElementById("nameForm").addEventListener("submit", e => {
  e.preventDefault();
  if(!closeNameGate(true)){
    // подсказываем, что поле пустое, вместо молчаливой подстановки чужого имени
    gateNote.textContent = "Впиши имя — под ним результат попадёт в таблицу.";
    gateNote.style.color = "var(--magenta)";
    nickInput.focus();
    return;
  }
  gateNote.textContent = gateNoteDefault;
  gateNote.style.color = "";
  Audio5.unlock();
  if(soundChoice === null) setSound(true, false);
  Audio5.sfx("heart");
});
/* Ранние сборки молча подставляли «ЯРИК», если поле оставили пустым.
   У кого осело такое имя — переспрашиваем один раз, дальше не пристаём. */
let nameAsked = false;
try { nameAsked = localStorage.getItem("gromila.nameAsked") === "1"; } catch(e){}
const stubName = player.toUpperCase() === "ЯРИК" && !nameAsked;
if(!player || stubName) openNameGate(stubName);
try { localStorage.setItem("gromila.nameAsked", "1"); } catch(e){}

function action(){
  Audio5.unlock();
  if(nameOpen) return;
  if(paused){ resume(); return; }
  // сами включаем звук только пока игрок не высказался — выключил, значит выключено
  if(soundChoice === null) setSound(true, false);
  if(state === "menu" || state === "over") startGame();
}
function moveMenu(step){
  if(state !== "menu") return;
  menuIndex = (menuIndex + step + DIFFS.length) % DIFFS.length;
  Audio5.sfx("dodge");
}
/* Смена соперника меняет мир целиком: палитру, фигуру и снаряд */
/* Надпись над экраном повторяет пару «игрок против соперника» */
function updateMarquee(){
  const sub = document.getElementById("marqueeSub");
  if(sub) sub.textContent = (player || "Ярик") + " против " + curBoss().vs.toLowerCase() + " · 1986";
}

function applyBoss(i){
  bossIndex = (i + BOSSES.length) % BOSSES.length;
  T = curBoss().theme;
  B = curBoss().body;
  loadBests();                       // у каждого соперника свой зачёт
  updateMarquee();
  try { localStorage.setItem("gromila.boss", curBoss().id); } catch(e){}
}
function shiftBoss(step){
  if(state !== "menu") return;
  applyBoss(bossIndex + step);
  buildScenery();
  Audio5.sfx(curBoss().sfx.throw);
}

/* ============================================================
   СКРЫТАЯ ВЫДАЧА МОНЕТ
   На клавиатуре — старый добрый код: ↑ ↑ ↓ ↓ ← → ← → B A.
   На телефоне клавиатуры нет, поэтому то же самое делает
   долгое удержание заголовка в меню.
   ============================================================ */
const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown",
                "ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","KeyB","KeyA"];
let konamiPos = 0;

function grantCoins(n){
  coins += n;
  saveWallet();
  Audio5.sfx("heart");
  say("+" + n + " МОНЕТ", W/2, H*0.38, P.orange, true);
  burst(W/2, H*0.45, 26, 120, [P.orange, P.bone, P.cyan], -1);
}

function konamiFeed(code){
  if(code === KONAMI[konamiPos]){
    konamiPos++;
    if(konamiPos === KONAMI.length){ konamiPos = 0; grantCoins(1000); }
  } else {
    konamiPos = (code === KONAMI[0]) ? 1 : 0;
  }
}

let titleHold = null;
function titleHoldStart(){
  clearTimeout(titleHold);
  titleHold = setTimeout(() => { titleHold = null; grantCoins(1000); }, 1600);
}
function titleHoldStop(){ clearTimeout(titleHold); titleHold = null; }

let shopIndex = 0;
function openShop(){
  state = "shop";
  shopIndex = 0;
  Audio5.sfx("dodge");
}
function buyItem(){
  const it = SHOP[shopIndex];
  if(coins < it.price){
    Audio5.sfx("hurt");
    return;
  }
  coins -= it.price;
  inv[it.id]++;
  saveWallet();
  Audio5.sfx("shield");
}

function openBoard(){
  state = "board";
  board.diff = menuIndex;
  board.boss = bossIndex;
  Audio5.sfx("dodge");
  loadBoard();
}
function shiftBoard(step){
  board.diff = (board.diff + step + DIFFS.length) % DIFFS.length;
  Audio5.sfx("dodge");
  loadBoard();
}
function shiftBoardBoss(step){
  board.boss = (board.boss + step + BOSSES.length) % BOSSES.length;
  Audio5.sfx("dodge");
  loadBoard();
}
window.addEventListener("keydown", e => {
  if(nameOpen){                       // пока вводят имя, игра клавиши не трогает
    if(e.code === "Escape" && player) closeNameGate(false);
    return;
  }
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if(!e.repeat) konamiFeed(e.code);          // копим последовательность скрытого кода
  if(e.repeat && (e.code === "ArrowUp" || e.code === "ArrowDown")) return;
  if(!e.repeat){
    if(e.code === "ArrowLeft"  || e.code === "KeyA") lastPress = "left";
    if(e.code === "ArrowRight" || e.code === "KeyD") lastPress = "right";
  }
  keys[e.code] = true;
  if(state === "menu"){
    if(e.code === "ArrowUp"   || e.code === "KeyW") moveMenu(-1);
    if(e.code === "ArrowDown" || e.code === "KeyS") moveMenu(1);
    if(e.code === "ArrowLeft"  || e.code === "KeyA") shiftBoss(-1);
    if(e.code === "ArrowRight" || e.code === "KeyD") shiftBoss(1);
    if(e.code === "KeyT") openBoard();
    if(e.code === "KeyB") openShop();
  } else if(state === "shop"){
    if(e.code === "ArrowUp"   || e.code === "KeyW") { shopIndex = (shopIndex+SHOP.length-1)%SHOP.length; Audio5.sfx("dodge"); }
    if(e.code === "ArrowDown" || e.code === "KeyS") { shopIndex = (shopIndex+1)%SHOP.length; Audio5.sfx("dodge"); }
    if(e.code === "Space" || e.code === "Enter") buyItem();
    if(e.code === "Escape") toMenu();
    return;
  } else if(state === "board"){
    if(e.code === "ArrowLeft")  shiftBoard(-1);
    if(e.code === "ArrowRight") shiftBoard(1);
    if(e.code === "ArrowUp"   || e.code === "KeyW") shiftBoardBoss(-1);
    if(e.code === "ArrowDown" || e.code === "KeyS") shiftBoardBoss(1);
    if(e.code === "Space" || e.code === "Enter" || e.code === "Escape"){ toMenu(); return; }
    return;
  }
  if(e.code === "Space" || e.code === "Enter") action();
  if(e.code === "Escape" && state !== "menu") toMenu();
  if(e.code === "KeyM") setSound(!Audio5.isEnabled(), true);
  if(e.code === "KeyN" && state === "menu") openNameGate();
  // купленное пускается в ход прямо в бою
  if(state === "play"){
    if(e.code === "Digit1" || e.code === "Numpad1") useItem("shield");
    if(e.code === "Digit2" || e.code === "Numpad2") useItem("life");
    if(e.code === "Digit3" || e.code === "Numpad3") useItem("x2");
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => { for(const k in keys) keys[k] = false; pressed.left = pressed.right = false; });

function pointerAt(e){
  // ведём Ярика к пальцу: точнее и понятнее, чем «левая/правая половина»
  const r = screenEl.getBoundingClientRect();
  touchX = clamp((e.clientX - r.left) / r.width * W, HERO_MIN_X, HERO_MAX_X);
}
screenEl.addEventListener("pointerdown", e => {
  if(nameOpen) return;
  screenEl.setPointerCapture && screenEl.setPointerCapture(e.pointerId);
  if(paused){ resume(); return; }
  {
    // ячейки предметов работают в бою, поэтому проверяем их раньше прочего
    const r0 = screenEl.getBoundingClientRect();
    const ux0 = (e.clientX - r0.left) / r0.width  * uiC.width;
    const uy0 = (e.clientY - r0.top)  / r0.height * uiC.height;
    if(state === "play"){
      const slot = slotRects.find(m => ux0 >= m.x && ux0 <= m.x+m.w && uy0 >= m.y && uy0 <= m.y+m.h);
      if(slot){ useItem(slot.id); return; }
    }
    if(state === "shop"){
      const row = shopRows.find(m => ux0 >= m.x && ux0 <= m.x+m.w && uy0 >= m.y && uy0 <= m.y+m.h);
      if(row){
        if(row.i !== shopIndex){ shopIndex = row.i; Audio5.sfx("dodge"); }
        else buyItem();
        return;
      }
      toMenu();
      return;
    }
  }
  if(state === "board"){
    const r = screenEl.getBoundingClientRect();
    const ux = (e.clientX - r.left) / r.width  * uiC.width;
    const uy = (e.clientY - r.top)  / r.height * uiC.height;
    const inRect = m => ux >= m.x && ux <= m.x+m.w && uy >= m.y && uy <= m.y+m.h;
    // касание строки: левая половина — предыдущий, правая — следующий
    if(inRect(boardBossRect)){ shiftBoardBoss(ux < boardBossRect.x + boardBossRect.w/2 ? -1 : 1); return; }
    if(inRect(boardDiffRect)){ shiftBoard(ux < boardDiffRect.x + boardDiffRect.w/2 ? -1 : 1); return; }
    toMenu();                                  // мимо строк — выход в меню
    return;
  }
  if(state === "menu"){
    // координаты клика — в системе интерфейсного холста
    const r = screenEl.getBoundingClientRect();
    const ux = (e.clientX - r.left) / r.width  * uiC.width;
    const uy = (e.clientY - r.top)  / r.height * uiC.height;
    if(ux >= nickRect.x && ux <= nickRect.x+nickRect.w &&
       uy >= nickRect.y && uy <= nickRect.y+nickRect.h){
      openNameGate();
      return;
    }
    if(ux >= boardRect.x && ux <= boardRect.x+boardRect.w &&
       uy >= boardRect.y && uy <= boardRect.y+boardRect.h){
      openBoard();
      return;
    }
    if(ux >= shopRect.x && ux <= shopRect.x+shopRect.w &&
       uy >= shopRect.y && uy <= shopRect.y+shopRect.h){
      openShop();
      return;
    }
    if(ux >= titleRect.x && ux <= titleRect.x+titleRect.w &&
       uy >= titleRect.y && uy <= titleRect.y+titleRect.h){
      titleHoldStart();                       // держим заголовок — идёт отсчёт
      return;
    }
    if(ux >= bossRect.x && ux <= bossRect.x+bossRect.w &&
       uy >= bossRect.y && uy <= bossRect.y+bossRect.h){
      shiftBoss(ux < bossRect.x + bossRect.w/2 ? -1 : 1);   // левый край назад, правый вперёд
      return;
    }
    const row = menuRects.find(m => ux >= m.x && ux <= m.x+m.w && uy >= m.y && uy <= m.y+m.h);
    if(row){
      if(row.i !== menuIndex){ menuIndex = row.i; Audio5.sfx("dodge"); return; }
    }
    action();
    return;
  }
  if(state === "over"){ action(); return; }
  pointerAt(e);
});
screenEl.addEventListener("pointermove", e => { if(touchX !== null) pointerAt(e); });
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  screenEl.addEventListener(ev, () => {
    touchX = null; pressed.left = pressed.right = false;
    titleHoldStop();                          // отпустили заголовок — отсчёт сбрасываем
  }));

/* Каждая кнопка забирает свой палец себе, поэтому нажимать можно обе
   разом, а соскользнувший с кнопки палец не считается отпущенным. */
function hold(btn, side){
  const other = side === "left" ? "right" : "left";
  const on = e => {
    e.preventDefault();
    pressed[side] = true;
    lastPress = side;
    Audio5.unlock();
    if(btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch(err){} }
  };
  const off = e => {
    e.preventDefault();
    pressed[side] = false;
    if(lastPress === side) lastPress = pressed[other] ? other : null;
  };
  btn.addEventListener("pointerdown", on);
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev => btn.addEventListener(ev, off));
}
hold(document.getElementById("btnLeft"), "left");
hold(document.getElementById("btnRight"), "right");

const soundBtn = document.getElementById("btnSound");

/* null — игрок ещё не решал (тогда звук включаем сами при первом действии),
   true/false — осознанный выбор, который больше нельзя перебивать */
let soundChoice = null;

function setSound(on, explicit){
  if(explicit) soundChoice = on;
  Audio5.setEnabled(on);
  if(on) Audio5.startMusic(); else Audio5.stopMusic();
  soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
  soundBtn.textContent = on ? "Звук вкл" : "Звук выкл";
}
soundBtn.addEventListener("click", () => {
  setSound(!Audio5.isEnabled(), true);
  soundBtn.blur();               // иначе Пробел будет жать кнопку вместо старта игры
});
document.getElementById("btnMenu").addEventListener("click", e => {
  if(state === "menu") action(); else toMenu();
  e.currentTarget.blur();
});

/* Поворот телефона меняет формат поля целиком, поэтому пересобираем мир,
   декорации и масштаб подписей, а всё живое возвращаем в новые границы. */
function relayout(){
  const prevW = W, prevH = H;
  layoutWorld();
  if(W !== prevW || H !== prevH || !stars.length){
    buildScenery();
    const kx = W/prevW;
    hero.x = clamp(hero.x*kx, HERO_MIN_X, HERO_MAX_X);
    boss.x = clamp(boss.x*kx, 90, W-90);
    for(const rk of rocks){ rk.x0 *= kx; rk.tx = clamp(rk.tx*kx, 26, W-26); rk.y0 = BOSS_FEET - 96; }
    for(const ht of hearts) ht.x = clamp(ht.x*kx, 30, W-30);
    craters.length = 0; parts.length = 0;
  }
  fitScreen();
  computeUiScale();
}

/* Safari на iPhone игнорирует user-scalable, поэтому глушим масштабирование
   вручную: щипок, двойной тап и системный dblclick. */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});
let lastTap = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTap < 320) e.preventDefault();     // второй тап подряд браузеру не отдаём
  lastTap = now;
}, {passive:false});

relayout();
zoneReset();
updateMarquee();
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", () => setTimeout(relayout, 250));

requestAnimationFrame(frame);
})();
</script>
