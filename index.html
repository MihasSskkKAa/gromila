<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Громила — ретро-аркада: мальчик Ярик уворачивается от камней великана.">
<title>Громила</title>
<style>
:root{
  --void:#0a0512;
  --cab:#150a24;
  --cab-2:#1e0f31;
  --edge:#3a1c52;
  --magenta:#e0396b;
  --cyan:#37e6d4;
  --orange:#ff8b3d;
  --bone:#f6e7c1;
  --dim:#9a7fae;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
/* touch-action не наследуется, поэтому задаём его каждому элементу —
   иначе двойной тап мимо экрана и кнопок всё равно приближает страницу */
*{box-sizing:border-box;touch-action:manipulation;}
html{height:100%;}
body{
  margin:0;
  background:var(--void);
  background-image:
    radial-gradient(120% 90% at 50% -20%, #2a103f 0%, rgba(42,16,63,0) 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,0) 1px 3px);
  color:var(--bone);
  font-family:var(--mono);
  min-height:100vh;
  min-height:100dvh;          /* адресная строка мобильного браузера не должна резать экран */
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(8px,2.4vw,28px);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;   /* никакого «потянуть, чтобы обновить» посреди боя */
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;  /* без зума по двойному тапу */
}
.cabinet{
  width:100%;
  max-width:980px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.marquee{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:0 4px;
}
.marquee h1{
  margin:0;
  font-size:clamp(20px,4.2vw,34px);
  font-weight:700;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--bone);
  text-shadow:2px 0 0 var(--magenta), -2px 0 0 var(--cyan), 0 0 22px rgba(224,57,107,.55);
}
.marquee .sub{
  font-size:clamp(9px,1.6vw,12px);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--dim);
}
.screen{
  position:relative;
  width:100%;
  margin-inline:auto;
  aspect-ratio:16/9;
  background:#0a0512;
  border:3px solid var(--edge);
  border-radius:14px;
  overflow:hidden;
  box-shadow:
    0 0 0 6px var(--cab),
    0 0 42px rgba(224,57,107,.28),
    0 22px 60px rgba(0,0,0,.65),
    inset 0 0 60px rgba(0,0,0,.7);
  cursor:default;
  touch-action:none;
}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#game{image-rendering:pixelated;image-rendering:crisp-edges;}
#ui{pointer-events:none;}
.fx{position:absolute;inset:0;pointer-events:none;}
.scanlines{
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 1px, rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;
  opacity:.75;
}
.glare{
  background:
    radial-gradient(130% 100% at 50% 0%, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 45%),
    radial-gradient(120% 120% at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 100%);
}
/* ---- окно ввода имени поверх экрана ---- */
.gate{
  position:absolute;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  background:rgba(10,5,18,.82);
}
.gate[hidden]{display:none;}
.gate-card{
  width:min(340px,100%);
  display:flex;flex-direction:column;gap:8px;
  padding:clamp(14px,3vw,22px);
  background:linear-gradient(180deg,#22103a,#170a28);
  border:1px solid var(--edge);
  border-radius:12px;
  box-shadow:0 0 0 3px rgba(10,5,18,.6),0 18px 40px rgba(0,0,0,.6);
  text-align:center;
}
.gate-eyebrow{
  margin:0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--orange);
}
.gate-label{
  font-size:clamp(15px,3.4vw,20px);letter-spacing:.08em;color:var(--bone);
}
.gate-note{
  margin:0;font-size:10px;letter-spacing:.06em;color:var(--dim);
}
#nickInput{
  font-family:inherit;
  font-size:clamp(18px,4.4vw,24px);
  letter-spacing:.16em;
  text-align:center;
  color:var(--cyan);
  background:#0f0620;
  border:1px solid #4d2569;
  border-radius:8px;
  padding:12px 10px;
  width:100%;
  min-height:52px;
}
#nickInput::placeholder{color:#5a4470;letter-spacing:.16em;}
#nickInput:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan);}
#nickOk{width:100%;min-height:50px;font-size:15px;background:#3a1c58;}
#nickOk:hover{background:#4a2470;}

.panel{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:linear-gradient(180deg,var(--cab-2),var(--cab));
  border:1px solid var(--edge);
  border-radius:12px;
}
.keys{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--dim);
  flex:1 1 240px;
}
kbd{
  display:inline-block;
  min-width:26px;
  padding:4px 7px;
  text-align:center;
  font-family:inherit;
  font-size:11px;
  color:var(--bone);
  background:#2b1442;
  border:1px solid #4d2569;
  border-bottom-width:3px;
  border-radius:5px;
}
.pads{display:flex;gap:8px;margin-left:auto;}
button{
  font-family:inherit;
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--bone);
  background:#2b1442;
  border:1px solid #4d2569;
  border-bottom:3px solid #4d2569;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  transition:background .12s ease, color .12s ease, transform .06s ease;
}
button:hover{background:#3a1c58;}
button:active{transform:translateY(2px);border-bottom-width:1px;}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
button[aria-pressed="true"]{color:var(--void);background:var(--cyan);border-color:var(--cyan);}
.pad{min-width:60px;font-size:16px;}
.credits{
  padding:0 6px;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#6d5580;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
/* ---- телефон, вертикально: экран сверху, крупные кнопки под ним ---- */
@media (max-width:700px){
  body{padding:6px;align-items:stretch;}
  .cabinet{gap:8px;justify-content:center;max-width:none;}
  .marquee,.credits,.keys{display:none;}   /* заголовок и подсказки уже есть внутри игры */
  .screen{border-width:2px;border-radius:10px;box-shadow:0 0 0 3px var(--cab),0 0 26px rgba(224,57,107,.22);}
  .panel{padding:8px;gap:8px;border-radius:10px;}
  .pads{
    margin-left:0;width:100%;
    display:grid;gap:8px;
    grid-template-columns:1fr 1fr;
    grid-template-areas:"left right" "menu sound";
  }
  #btnLeft{grid-area:left;} #btnRight{grid-area:right;}
  #btnMenu{grid-area:menu;} #btnSound{grid-area:sound;}
  .pad{
    min-height:clamp(64px,12vh,104px);
    font-size:28px;
    background:#33195a;
    border-color:#5c2e80;
  }
  .pad:active{background:var(--cyan);color:var(--void);}
  #btnMenu,#btnSound{min-height:48px;font-size:12px;padding:8px 6px;letter-spacing:.1em;}
}

/* ---- телефон, горизонтально: экран во всю высоту, узкая полоса кнопок ---- */
@media (max-height:520px) and (orientation:landscape){
  body{padding:4px;}
  .cabinet{gap:5px;}
  .marquee,.credits,.keys{display:none;}
  .screen{border-width:2px;}   /* вписыванием по высоте занимается fitScreen() */
  .panel{padding:5px;gap:6px;}
  .pads{margin-left:0;width:100%;display:flex;gap:6px;}
  .pad{flex:1;min-height:46px;font-size:20px;background:#33195a;}
  .pad:active{background:var(--cyan);color:var(--void);}
  #btnMenu,#btnSound{min-height:46px;font-size:11px;padding:6px 10px;}
}

@media (prefers-reduced-motion:reduce){
  .screen{box-shadow:0 0 0 6px var(--cab),0 18px 40px rgba(0,0,0,.6);}
}
</style>
</head>
<body>
<main class="cabinet">
  <div class="marquee">
    <h1>Громила</h1>
    <span class="sub" id="marqueeSub">Ярик против великана · 1986</span>
  </div>

  <div class="screen" id="screen">
    <canvas id="game" width="480" height="270" aria-label="Игровое поле"></canvas>
    <canvas id="ui" width="960" height="540" aria-hidden="true"></canvas>
    <div class="fx scanlines"></div>
    <div class="fx glare"></div>

    <div class="gate" id="nameGate" hidden>
      <form class="gate-card" id="nameForm">
        <p class="gate-eyebrow">Новый боец</p>
        <label class="gate-label" for="nickInput">Как тебя зовут?</label>
        <input id="nickInput" name="nick" type="text" maxlength="12"
               autocomplete="nickname" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="введи имя">
        <p class="gate-note">Имя сохранится и встанет рядом с рекордом.</p>
        <button type="submit" id="nickOk">В бой</button>
      </form>
    </div>
  </div>

  <div class="panel">
    <div class="keys">
      <kbd>←</kbd><kbd>→</kbd> бежать &nbsp;·&nbsp; <kbd>↑</kbd><kbd>↓</kbd> выбор &nbsp;·&nbsp; <kbd>Space</kbd> старт &nbsp;·&nbsp; <kbd>Esc</kbd> меню
    </div>
    <div class="pads">
      <button class="pad" id="btnLeft" aria-label="Влево">◀</button>
      <button class="pad" id="btnRight" aria-label="Вправо">▶</button>
      <button id="btnMenu">Меню</button>
      <button id="btnSound" aria-pressed="false">Звук выкл</button>
    </div>
  </div>

  <div class="credits">
    <span>Уворачивайся. Громила не устаёт.</span>
    <span>Chiptune · Web Audio</span>
  </div>
</main>

<script>
(function(){
"use strict";

/* ============================================================
   ХОЛСТЫ
   Мир рисуется в 480x270 и растягивается CSS'ом (pixelated),
   интерфейс — на отдельном холсте 960x540, чтобы текст был чётким.
   ============================================================ */
/* Размер мира зависит от устройства: на широком экране кинематографичные 480x270,
   на телефоне в портрете — узкое и высокое поле, чтобы картинка не сжималась в полоску. */
let W = 480, H = 270;
let HORIZON_Y, BOSS_FEET, GROUND_TOP, GROUND_Y, HERO_MIN_X, HERO_MAX_X;

const world = document.getElementById("game");
const g = world.getContext("2d");
const uiC = document.getElementById("ui");
const u = uiC.getContext("2d");
const screenEl = document.getElementById("screen");
g.imageSmoothingEnabled = false;

/* сенсорный экран: подсказки и управление отличаются от настольных */
const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

/* Все горизонты — доли высоты, поэтому пропорции сцены сохраняются при любом формате.
   Множители подобраны так, что при H=270 получаются исходные 168 / 172 / 196 / 238. */
function layoutWorld(){
  const portrait = window.matchMedia("(max-width: 700px) and (orientation: portrait)").matches;
  W = portrait ? 300 : 480;
  H = portrait ? 430 : 270;

  HORIZON_Y  = Math.round(H * 0.622);   // верх дальнего плато
  BOSS_FEET  = HORIZON_Y + 4;           // ноги Громилы
  GROUND_TOP = Math.round(H * 0.726);   // начало переднего плана
  GROUND_Y   = Math.round(H * 0.881);   // линия ног Ярика
  HERO_MIN_X = 26;
  HERO_MAX_X = W - 26;

  world.width = W; world.height = H;
  uiC.width = W * 2; uiC.height = H * 2;
  screenEl.style.aspectRatio = W + " / " + H;
  g.imageSmoothingEnabled = false;
}

/* Вписываем экран в свободную высоту: aspect-ratio сам посчитает высоту,
   наша задача — не дать ширине вырасти так, что низ уедет под кнопки.
   Ограничиваем весь корпус, а не только экран, иначе он прижимается к левому краю,
   а панель остаётся во всю ширину — картинка уезжает вбок. */
function fitScreen(){
  const cabinet = document.querySelector(".cabinet");
  const panel = document.querySelector(".panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;
  const avail = window.innerHeight - panelH - 40;
  const byHeight = avail > 120 ? Math.floor(avail * W / H) : Infinity;
  cabinet.style.maxWidth = Math.min(980, byHeight) + "px";
  cabinet.style.marginInline = "auto";
  screenEl.style.maxWidth = "";
}

/* ============================================================
   ПАЛИТРА
   ============================================================ */
/* Ярик и служебные цвета интерфейса — общие для всех миров */
const P = {
  shirt:"#3a7ad4", shirtLo:"#255296", pants:"#8a4a2a",
  skin:"#f3c79b", hair:"#f2b83c", dark:"#160c22",
  magenta:"#e0396b", cyan:"#37e6d4", bone:"#f6e7c1", orange:"#ff8b3d"
};

/* ============================================================
   СОПЕРНИКИ
   У каждого свой снаряд, своя манера и свой мир: небо, горизонт,
   земля и подсветка маркеров подобраны под то, чем он швыряется.
   ============================================================ */
const BOSSES = [
  {
    id:"gromila", name:"ГРОМИЛА", vs:"ГРОМИЛЫ", ammo:"камни",
    hint:"Швыряет камни с дальнего плато. Медленно, зато тяжело.",
    kit:{fly:1.00, gap:1.00, hitR:13, bigR:26, arc:46, spin:9},
    sfx:{throw:"throw", land:"impact", big:"boom"},
    theme:{
      sky:["#160a2b","#200d38","#2e1046","#431453","#5f1a5c","#84215f","#a92c5b","#cc4352","#e8664a","#f79150"],
      orb:["#ffe08a","#ff9f4d","#ef5f5a"], orbBand:"#a92c5b", orbY:-26, orbR:0.215, orbX:0,
      ridge:"spikes", ridgeFar:"#2b1444", ridgeNear:"#22103a",
      plateau:"#1d0c2f", plateauTop:"#3b1a52", chasm:"#0d0518",
      ground:"#2c1339", groundTop:"#4d2360", speck:"#5f2c72", scan:"#0d0518",
      star:"#f6e7c1", weather:"none",
      markCold:"#37e6d4", markBig:"#ff8b3d", markHot:"#e0396b", markAim:"#ff6b9d",
      shade:"#0d0518", crater:["#180a26","#2a1240"]
    },
    body:{skin:"#5f7a3c", skinLo:"#3f5527", skinHi:"#86a45a", cloth:"#7a4526", clothLo:"#542d17", eye:"#ff5a4a"},
    shot:{main:"#8b8496", lo:"#5d5769", hi:"#b6afc2", dust:["#8b8496","#5d5769","#5f2c72","#b6afc2"]}
  },
  {
    id:"strelok", name:"СТРЕЛОК", vs:"СТРЕЛКА", ammo:"стрелы",
    hint:"Бьёт стрелами из ночного леса. Летят быстро и жалят точно.",
    kit:{fly:0.78, gap:0.92, hitR:10, bigR:20, arc:30, spin:0},
    sfx:{throw:"twang", land:"thud", big:"boom"},
    theme:{
      sky:["#04070e","#071019","#0b1a24","#0f2530","#14313a","#1a3d42","#224a48","#2d5850","#3b6857","#4d7a5f"],
      orb:["#eef6e0","#cfe3bd","#9dbc92"], orbBand:"#14313a", orbY:-40, orbR:0.13, orbX:-0.26,
      ridge:"forest", ridgeFar:"#0a1a18", ridgeNear:"#06110f",
      plateau:"#08150f", plateauTop:"#16301f", chasm:"#030806",
      ground:"#0d1c12", groundTop:"#24422a", speck:"#31543a", scan:"#030806",
      star:"#dff0d8", weather:"none",
      markCold:"#8ce06a", markBig:"#ffd24a", markHot:"#ff5a4a", markAim:"#ff8f4a",
      shade:"#030806", crater:["#05100a","#123018"]
    },
    body:{skin:"#4e8560", skinLo:"#31573c", skinHi:"#79b183", cloth:"#3b6152", clothLo:"#234134", eye:"#d4ff7a"},
    shot:{main:"#c9a06a", lo:"#8a6a42", hi:"#efe0c0", dust:["#c9a06a","#8a6a42","#31543a","#efe0c0"]}
  },
  {
    id:"snegovik", name:"СНЕГОВИК", vs:"СНЕГОВИКА", ammo:"снежки",
    hint:"Лепит снежки. Комья лежат на земле — не наступай.",
    kit:{fly:1.22, gap:0.86, hitR:16, bigR:30, arc:58, spin:5},
    sfx:{throw:"whoosh", land:"pack", big:"boom"},
    theme:{
      sky:["#0a1230","#101a42","#182456","#20306a","#2a3f7e","#365290","#44689d","#5681ab","#6d9cbb","#8ab6cb"],
      orb:["#f2fbff","#d6ecfa","#a9cfe6"], orbBand:"#2a3f7e", orbY:-34, orbR:0.17, orbX:0.2,
      ridge:"snowcaps", ridgeFar:"#243a63", ridgeNear:"#1a2c4d",
      plateau:"#22355c", plateauTop:"#6f90b8", chasm:"#0c1430",
      ground:"#9db9d4", groundTop:"#e6f2fb", speck:"#c2d8ea", scan:"#7d9cbb",
      star:"#ffffff", weather:"snow",
      markCold:"#1e4fa0", markBig:"#c0392b", markHot:"#e0396b", markAim:"#8e2f7a",
      shade:"#6d8cae", crater:["#7f9dbb","#b3cde0"]
    },
    body:{skin:"#eef6fb", skinLo:"#b9cfe2", skinHi:"#ffffff", cloth:"#c0392b", clothLo:"#8d2a20", eye:"#1a2c4d"},
    shot:{main:"#f4fbff", lo:"#bcd6e8", hi:"#ffffff", dust:["#ffffff","#dceaf6","#bcd6e8","#f4fbff"]}
  }
];

let bossIndex = 0;
let T = BOSSES[0].theme;          // палитра мира
let B = BOSSES[0].body;           // палитра фигуры соперника
const curBoss = () => BOSSES[bossIndex];

/* ============================================================
   ЗВУК — чиптюн 80-х на Web Audio
   ============================================================ */
const Audio5 = (function(){
  let ac=null, master=null, musicBus=null, duckBus=null, leadBus=null, sfxBus=null, noiseBuf=null;
  let enabled=false, running=false, timer=null;
  let step=0, nextTime=0, bpm=126, intensity=0;

  /* Am7 - Fmaj7 - C - G: тот же ход, но с добавленными ступенями —
     звучит мягче и современнее голого трезвучия. */
  const PROG = [
    {root:45, chord:[57,60,64,67]},
    {root:41, chord:[53,57,60,64]},
    {root:48, chord:[55,60,64,67]},
    {root:43, chord:[50,55,59,62]}
  ];
  const R = -1;
  // лид дышит длинными нотами поверх бита, а не сыплет восьмыми
  const LEAD = [
    [76,R,R,R,R,R,74,R, 72,R,R,R,R,R,R,R],
    [72,R,R,R,74,R,R,R, 76,R,R,R,R,R,72,R],
    [79,R,R,R,R,R,76,R, 74,R,R,R,R,R,R,R],
    [74,R,R,R,72,R,R,R, 71,R,R,R,R,R,R,R]
  ];

  const mtof = m => 440 * Math.pow(2, (m-69)/12);

  function build(){
    if(ac) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    ac = new Ctx();

    master = ac.createGain();
    master.gain.value = 0.0;
    const cap = ac.createDynamicsCompressor();
    cap.threshold.value = -12; cap.ratio.value = 6;
    master.connect(cap); cap.connect(ac.destination);

    musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    sfxBus   = ac.createGain(); sfxBus.gain.value   = 0.85; sfxBus.connect(master);

    /* Сайдчейн: всё, кроме бочки, идёт через duckBus, который на каждом
       ударе приседает и отпускает. Это то самое «дыхание» танцевальной
       музыки, из-за которого трек звучит современно, а не как чиптюн. */
    duckBus = ac.createGain(); duckBus.gain.value = 1; duckBus.connect(musicBus);

    // лид и арпеджио — через задержку с затуханием, дают воздух
    leadBus = ac.createGain(); leadBus.gain.value = 0.55; leadBus.connect(duckBus);
    const dly = ac.createDelay(0.7); dly.delayTime.value = 0.24;
    const fb  = ac.createGain(); fb.gain.value = 0.34;
    const dampen = ac.createBiquadFilter(); dampen.type="lowpass"; dampen.frequency.value=3200;
    const wet = ac.createGain(); wet.gain.value = 0.5;
    leadBus.connect(dly); dly.connect(dampen); dampen.connect(fb); fb.connect(dly);
    dampen.connect(wet); wet.connect(duckBus);

    const n = ac.sampleRate * 0.6;
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  }

  function tone(type, freq, t, dur, vol, dest, glideTo){
    const o = ac.createOscillator();
    const gn = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t+dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(gn); gn.connect(dest||sfxBus);
    o.start(t); o.stop(t+dur+0.02);
  }

  function noise(t, dur, vol, freq, q, sweepTo, dest){
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q||1;
    if(sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t+dur);
    const gn = ac.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(gn); gn.connect(dest||sfxBus);
    src.start(t); src.stop(t+dur+0.02);
  }

  /* Расстроенный «супер-соу»: три пилы чуть врозь по высоте — от этого
     звук становится широким и живым вместо плоского писка. */
  function superSaw(freq, t, dur, vol, dest, cutFrom, cutTo, q){
    const f = ac.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(cutFrom, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(120, cutTo), t + dur*0.9);
    f.Q.value = q === undefined ? 6 : q;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(gn); gn.connect(dest || duckBus);
    [-9, 0, 9].forEach(cents => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.value = freq;
      o.detune.value = cents;
      o.connect(f);
      o.start(t); o.stop(t + dur + 0.03);
    });
  }

  function kick(t){
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    gn.gain.setValueAtTime(0.9, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    o.connect(gn); gn.connect(musicBus);          // бочка мимо сайдчейна
    o.start(t); o.stop(t + 0.32);
    noise(t, 0.02, 0.18, 1800, 0.8, 900, musicBus);   // щелчок атаки

    // и она же «пригибает» всё остальное
    duckBus.gain.cancelScheduledValues(t);
    duckBus.gain.setValueAtTime(1, t);
    duckBus.gain.linearRampToValueAtTime(0.38, t + 0.012);
    duckBus.gain.linearRampToValueAtTime(1, t + 0.19);
  }

  function clap(t){
    [0, 0.011, 0.023].forEach((d, i) =>
      noise(t + d, 0.05, 0.16 - i*0.03, 1700, 1.4, 1200, duckBus));
    noise(t + 0.03, 0.18, 0.10, 1300, 0.9, 700, duckBus);
  }

  function hat(t, open, vol){
    noise(t, open ? 0.16 : 0.035, vol, 9000, 1.6, open ? 7000 : 8000, duckBus);
  }

  function playStep(i, t){
    const bar = Math.floor(i/16) % 4;
    const s = i % 16;
    const ch = PROG[bar];
    const hot = intensity;
    const cut = 900 + hot*2600;                  // с волнами трек раскрывается

    if(s % 4 === 0) kick(t);                     // ровная бочка в каждую долю
    if(s === 4 || s === 12) clap(t);
    if(s % 2 === 1) hat(t, false, 0.07 + hot*0.03);          // хэт на слабую долю
    if(s === 14) hat(t, true, 0.06);
    if(hot > 0.5 && s % 2 === 0) hat(t, false, 0.03);        // на скорости — шестнадцатые

    // бас: короткий и упругий, между ударами бочки
    if(s % 2 === 0){
      const oct = (s === 8) ? 12 : 0;
      superSaw(mtof(ch.root + oct), t, 0.19, 0.26, duckBus, 260 + hot*260, 130, 9);
    }
    // подложка: аккорд тянется весь такт
    if(s === 0){
      const beat = 60/bpm;
      ch.chord.forEach(n =>
        superSaw(mtof(n), t, beat*3.6, 0.045 + hot*0.015, duckBus, 700 + hot*900, 500, 2));
    }
    // арпеджио — только на восьмых, чтобы не тарахтело
    if(s % 2 === 1){
      const arp = ch.chord[(Math.floor(s/2) + bar) % ch.chord.length] + 12;
      superSaw(mtof(arp), t, 0.11, 0.05 + hot*0.02, leadBus, 2200, 1400, 4);
    }
    // лид
    const nte = LEAD[bar][s];
    if(nte > 0) superSaw(mtof(nte + (hot > 0.65 ? 12 : 0)), t, 0.42, 0.085, leadBus, 3000, 1200, 3);
  }

  function tick(){
    if(!ac) return;
    const spb = 60 / bpm / 4;
    while(nextTime < ac.currentTime + 0.14){
      playStep(step, nextTime);
      nextTime += spb;
      step++;
    }
  }

  return {
    unlock(){
      build();
      if(!ac) return;
      if(ac.state === "suspended") ac.resume();
    },
    setEnabled(on){
      enabled = on;
      if(on) this.unlock();
      if(!ac) return;
      const now = ac.currentTime;
      // фиксируем текущее значение, иначе рампа поедет от последнего события автоматизации
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(on ? 0.5 : 0.0, now + 0.12);
    },
    isEnabled(){ return enabled; },
    startMusic(){
      this.unlock();
      if(!ac || running) return;
      running = true;
      step = 0;
      nextTime = ac.currentTime + 0.08;
      timer = setInterval(tick, 25);
    },
    stopMusic(){
      running = false;
      if(timer) clearInterval(timer);
      timer = null;
    },
    setIntensity(v){ intensity = Math.max(0, Math.min(1, v)); bpm = 126 + intensity*14; },
    duck(amount, secs){
      if(!ac) return;
      musicBus.gain.cancelScheduledValues(ac.currentTime);
      musicBus.gain.setValueAtTime(musicBus.gain.value, ac.currentTime);
      musicBus.gain.linearRampToValueAtTime(0.55*amount, ac.currentTime+0.05);
      musicBus.gain.linearRampToValueAtTime(0.55, ac.currentTime+secs);
    },
    sfx(name){
      if(!ac || !enabled) return;
      const t = ac.currentTime + 0.01;
      switch(name){
        case "throw":
          tone("square", 220, t, 0.20, 0.10, sfxBus, 620);
          noise(t, 0.22, 0.10, 700, 0.9, 2600);
          break;
        case "impact":
          noise(t, 0.30, 0.34, 900, 0.6, 90);
          tone("sine", 110, t, 0.28, 0.40, sfxBus, 34);
          break;
        case "twang":                       // спуск тетивы
          tone("triangle", 330, t, 0.16, 0.22, sfxBus, 120);
          noise(t, 0.10, 0.10, 2600, 2.0, 900);
          break;
        case "thud":                        // стрела вошла в землю
          noise(t, 0.14, 0.22, 1600, 1.4, 300);
          tone("sine", 160, t, 0.14, 0.24, sfxBus, 60);
          break;
        case "whoosh":                      // снежок пошёл по дуге
          noise(t, 0.26, 0.12, 500, 0.7, 1500);
          break;
        case "pack":                        // мягкий шлепок снега
          noise(t, 0.22, 0.26, 400, 0.5, 140);
          tone("sine", 90, t, 0.18, 0.22, sfxBus, 40);
          break;
        case "boom":
          noise(t, 0.50, 0.42, 700, 0.5, 60);
          tone("sine", 80, t, 0.45, 0.50, sfxBus, 28);
          tone("sawtooth", 60, t, 0.30, 0.16, sfxBus, 25);
          break;
        case "hurt":
          tone("square", 440, t, 0.30, 0.26, sfxBus, 70);
          noise(t+0.02, 0.22, 0.16, 1200, 0.7, 200);
          break;
        case "dodge":
          tone("square", 880, t, 0.06, 0.12, sfxBus);
          tone("square", 1320, t+0.06, 0.07, 0.12, sfxBus);
          break;
        case "heart":
          [0,0.07,0.14,0.21].forEach((d,i)=>tone("square", mtof(72+i*4), t+d, 0.10, 0.14, sfxBus));
          break;
        case "shield":                       // подобрал щит — тёплый аккорд
          [64,68,71,76].forEach((n,i)=>tone("triangle", mtof(n), t+i*0.05, 0.34, 0.13, sfxBus));
          noise(t, 0.25, 0.06, 3000, 1.4, 6000);
          break;
        case "shieldBreak":                  // щит принял удар и рассыпался
          tone("triangle", 720, t, 0.22, 0.20, sfxBus, 240);
          noise(t, 0.26, 0.18, 2200, 1.1, 500);
          break;
        case "roar":
          tone("sawtooth", 90, t, 0.75, 0.30, sfxBus, 42);
          noise(t, 0.75, 0.22, 320, 0.7, 120);
          break;
        case "start":
          [0,0.08,0.16,0.30].forEach((d,i)=>tone("square", mtof([57,64,69,76][i]), t+d, i===3?0.32:0.10, 0.18, sfxBus));
          break;
        case "over":
          [0,0.16,0.32,0.50].forEach((d,i)=>tone("square", mtof([69,67,64,57][i]), t+d, i===3?0.7:0.16, 0.20, sfxBus));
          tone("sawtooth", 60, t+0.5, 0.9, 0.18, sfxBus, 30);
          break;
      }
    }
  };
})();

/* В базе может не быть колонки boss — тогда зачёт общий для всех соперников.
   Выясняем это по первому же ответу сервера и дальше не спрашиваем. */
let cloudHasBoss = null;               // null — пока не знаем, true/false — выяснили

/* Отправка результата. Сеть может отвалиться — игре это безразлично. */
function cloudSubmit(name, value, diffId, seconds){
  if(!cloudOn() || !name || value <= 0) return Promise.resolve(false);
  const row = {name: name.slice(0,12), score: Math.floor(value), difficulty: diffId};
  const full = Object.assign({boss: curBoss().id, runtime: Math.round(seconds*10)/10}, row);
  const post = body => fetch(CLOUD.url + "/rest/v1/" + CLOUD.table, {
    method: "POST",
    headers: cloudHeaders({"Prefer": "return=minimal"}),
    body: JSON.stringify(body)
  });
  // в старой базе может не быть ни boss, ни runtime — тогда шлём голый результат
  if(cloudHasBoss === false) return post(row).then(r => r.ok).catch(() => false);
  return post(full)
    .then(r => {
      if(r.ok){ cloudHasBoss = true; return true; }
      cloudHasBoss = false;
      return post(row).then(r2 => r2.ok);
    })
    .catch(() => false);
}

/* В базе лежит каждая партия отдельной строкой, а в рейтинге человек должен
   занимать одно место. Список приходит отсортированным по убыванию, поэтому
   первое встреченное имя — это и есть лучший результат игрока. */
function collapseByPlayer(rows){
  const seen = new Map();
  for(const r of rows || []){
    const key = String(r.name || "").trim().toLowerCase();
    if(!key) continue;
    if(!seen.has(key)) seen.set(key, {name: r.name, score: r.score});
  }
  return Array.from(seen.values());
}

/* Место игрока в рейтинге: позиция его лучшего результата среди всех игроков */
function cloudRank(value, diffId){
  return cloudRows(diffId, 400).then(rows => {
    const table = collapseByPlayer(rows);
    const me = String(player || "").trim().toLowerCase();
    const idx = table.findIndex(r => String(r.name).trim().toLowerCase() === me);
    return {place: idx >= 0 ? idx + 1 : null, total: table.length};
  });
}

/* Сырые записи по сложности и сопернику — уже отсортированные по убыванию */
function cloudRows(diffId, limit, bossId){
  if(!cloudOn()) return Promise.reject(new Error("off"));
  const who = bossId || curBoss().id;
  const base = "?select=name,score&difficulty=eq." + encodeURIComponent(diffId) +
               "&order=score.desc&limit=" + limit;
  const get = q => fetch(CLOUD.url + "/rest/v1/" + CLOUD.table + q, {headers: cloudHeaders()});
  const tryBoss = cloudHasBoss !== false;
  return get(base + (tryBoss ? "&boss=eq." + encodeURIComponent(who) : ""))
    .then(r => {
      if(r.ok){ if(tryBoss) cloudHasBoss = true; return r.json(); }
      if(!tryBoss) throw new Error("http " + r.status);
      cloudHasBoss = false;                        // колонки нет — читаем общий список
      return get(base).then(r2 => {
        if(!r2.ok) throw new Error("http " + r2.status);
        return r2.json();
      });
    });
}

/* Десятка лучших: по одной строке на игрока */

        → held (4 с в узком поле) → opening (плавно расходятся) → idle */
const zone = {
  phase: "idle", t: 0, next: rnd(18, 30),
  l: 0, r: 0,            // где стены сейчас
  fromL: 0, fromR: 0,    // откуда едут
  toL: 0, toR: 0         // куда едут
};
const WARN_T = 3, CLOSE_T = 1.6, HOLD_T = 4, OPEN_T = 1.8;

function zoneReset(){
  zone.phase = "idle"; zone.t = 0; zone.next = rnd(18, 30);
  zone.l = HERO_MIN_X - 12; zone.r = HERO_MAX_X + 12;
}

function zonePlan(){
  const full = (HERO_MAX_X - HERO_MIN_X);
  const width = full * rnd(0.44, 0.58);          // во столько раз ужимаем поле
  const center = clamp(rnd(HERO_MIN_X + width/2, HERO_MAX_X - width/2),
                       HERO_MIN_X + width/2, HERO_MAX_X - width/2);
  zone.fromL = zone.l; zone.fromR = zone.r;
  zone.toL = Math.round(center - width/2);
  zone.toR = Math.round(center + width/2);
  zone.phase = "warn"; zone.t = 0;
  say("ЗОНА СУЖАЕТСЯ!", W/2, H*0.33, T.markHot, true);
  Audio5.sfx("roar");
}

function zoneStep(dt){
  if(state !== "play"){ if(zone.phase !== "idle") zoneReset(); return; }
  zone.t += dt;
  switch(zone.phase){
    case "idle":
      if(zone.t >= zone.next) zonePlan();
      break;
    case "warn":
      if(zone.t >= WARN_T){ zone.phase = "closing"; zone.t = 0; }
      break;
    case "closing": {
      const k = clamp(zone.t / CLOSE_T, 0, 1);
      zone.l = lerp(zone.fromL, zone.toL, k);
      zone.r = lerp(zone.fromR, zone.toR, k);
      if(k >= 1){ zone.phase = "held"; zone.t = 0; }
      break;
    }
    case "held":
      if(zone.t >= HOLD_T){
        zone.phase = "opening"; zone.t = 0;
        zone.fromL = zone.l; zone.fromR = zone.r;
      }
      break;
    case "opening": {
      const k = clamp(zone.t / OPEN_T, 0, 1);
      zone.l = lerp(zone.fromL, HERO_MIN_X - 12, k);
      zone.r = lerp(zone.fromR, HERO_MAX_X + 12, k);
      if(k >= 1){ zoneReset(); }
      break;
    }
  }
}

/* ============================================================
   ПИКСЕЛЬНЫЕ СПРАЙТЫ
   Одни и те же карты рисуются и в мире, и в интерфейсе — поэтому
   падающее сердце выглядит ровно так же, как сердце в шапке.
   ============================================================ */
const HEART = [
  "01100110",
  "11111111",
  "11111111",
  "11111111",
  "01111110",
  "00111100",
  "00011000"
];
const SHIELD = [
  "01111110",
  "11111111",
  "11111111",
  "11111111",
  "01111110",
  "00111100",
  "00011000"
];

function paintSprite(ctx2, map, x, y, s, body, edge, shine){
  const w = map[0].length;
  if(edge){
    ctx2.fillStyle = edge;
    for(let r=0;r<map.length;r++)
      for(let c=0;c<w;c++)
        if(map[r][c] === "1") ctx2.fillRect(x + c*s + s*0.35, y + r*s + s*0.35, s, s);
  }
  ctx2.fillStyle = body;
  for(let r=0;r<map.length;r++)
    for(let c=0;c<w;c++)
      if(map[r][c] === "1") ctx2.fillRect(x + c*s, y + r*s, s, s);
  if(shine){
    ctx2.fillStyle = shine;
    ctx2.fillRect(x + s, y + s, s, s);
    ctx2.fillRect(x + 2*s, y + s, s, s);
    ctx2.fillRect(x + s, y + 2*s, s, s);
  }
}

/* ============================================================
   ПРИМИТИВЫ РИСОВАНИЯ (целые пиксели)
   ============================================================ */
function px(x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0, y|0, Math.max(1,w|0), Math.max(1,h|0)); }
function limb(x1,y1,x2,y2,r,c){
  const dx=x2-x1, dy=y2-y1;
  const n = Math.max(1, Math.ceil(Math.hypot(dx,dy)/1.5));
  for(let i=0;i<=n;i++){
    const t=i/n;
    px(x1+dx*t-r, y1+dy*t-r, r*2, r*2, c);
  }
}
function disc(cx,cy,r,c){
  g.fillStyle=c;
  for(let y=-r;y<=r;y++){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    if(w>0) g.fillRect((cx-w)|0, (cy+y)|0, w*2, 1);
  }
}
function ring(cx,cy,rx,ry,c,thick){
  g.strokeStyle=c; g.lineWidth=thick||1;
  g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); g.stroke();
}

/* ============================================================
   ФОН
   ============================================================ */
function drawSky(){
  const SKY = T.sky;
  const bandH = Math.ceil(HORIZON_Y / SKY.length);
  for(let i=0;i<SKY.length;i++) px(0, i*bandH, W, bandH, SKY[i]);

  // звёзды в верхней трети
  for(const s of stars){
    const tw = 0.45 + 0.55*Math.sin(time*2 + s.p);
    if(tw > 0.55){
      g.globalAlpha = Math.min(1, (tw-0.5)*1.6);
      px(s.x, s.y, s.s, s.s, T.star);
      g.globalAlpha = 1;
    }
  }

  // светило: закатное солнце, лесная луна или морозный диск
  const cx = Math.round(W/2 + W*(T.orbX||0)), cy = HORIZON_Y + T.orbY, r = Math.round(H*T.orbR);
  disc(cx, cy, r, T.orb[0]);
  for(let y=-r;y<=r;y++){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    if(!w) continue;
    const t = (y+r)/(2*r);
    g.fillStyle = t<0.35 ? T.orb[0] : t<0.62 ? T.orb[1] : T.orb[2];
    g.fillRect((cx-w)|0, (cy+y)|0, w*2, 1);
  }
  for(let y=6, gap=3; y<r; gap+=1.2, y+=gap+2){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    px(cx-w, cy+y, w*2, Math.max(1, gap|0), T.orbBand);
  }

  drawRidge();
}

/* Линия горизонта у каждого своя: скалы, еловый лес или заснеженные пики */
function drawRidge(){
  const step = W/(ridge.length-1);
  if(T.ridge === "forest"){
    for(let pass=0; pass<2; pass++){
      g.fillStyle = pass ? T.ridgeNear : T.ridgeFar;
      const drop = pass ? 14 : 0;
      for(let i=0;i<ridge.length;i++){
        const x = i*step, top = ridge[i] + drop + (i%3)*4;
        const halfBase = 9 + (i%4)*2;
        g.beginPath();
        g.moveTo(x, top);
        g.lineTo(x - halfBase, HORIZON_Y);
        g.lineTo(x + halfBase, HORIZON_Y);
        g.closePath(); g.fill();
      }
    }
    return;
  }
  g.fillStyle = T.ridgeFar;
  g.beginPath(); g.moveTo(0, HORIZON_Y);
  for(let i=0;i<ridge.length;i++) g.lineTo(i*step, ridge[i]);
  g.lineTo(W, HORIZON_Y); g.closePath(); g.fill();
  g.fillStyle = T.ridgeNear;
  g.beginPath(); g.moveTo(0, HORIZON_Y);
  for(let i=0;i<ridge.length;i++) g.lineTo(i*step, ridge[i]+12+((i%4)*3));
  g.lineTo(W, HORIZON_Y); g.closePath(); g.fill();

  if(T.ridge === "snowcaps"){          // снежные шапки на вершинах
    g.fillStyle = T.groundTop;
    for(let i=0;i<ridge.length;i++){
      const x = i*step, y = ridge[i];
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x-5, y+7); g.lineTo(x+5, y+7);
      g.closePath(); g.fill();
    }
  }
}

function drawGround(){
  const gap = GROUND_TOP - HORIZON_Y;           // провал между планами
  px(0, HORIZON_Y, W, gap, T.chasm);
  px(0, HORIZON_Y, W, Math.round(gap*0.65), T.plateau);   // дальнее плато
  px(0, HORIZON_Y, W, 2, T.plateauTop);
  px(0, GROUND_TOP, W, H-GROUND_TOP, T.ground);           // передний план
  px(0, GROUND_TOP, W, 2, T.groundTop);
  px(0, GROUND_TOP+2, W, 2, T.speck);
  for(const s of specks) px(s.x, s.y, s.w, 1, T.speck);
  for(let y=GROUND_TOP+10; y<H; y+=7) { g.globalAlpha=.14; px(0,y,W,1,T.scan); g.globalAlpha=1; }
}

/* ============================================================
   ГРОМИЛА
   ============================================================ */
function bossPose(){
  // 0 — покой, 1 — замах, 2 — бросок
  let a1, a2;
  if(boss.state === "windup"){
    const t = Math.min(1, boss.t / WINDUP);
    a1 = lerp(0.42, -2.35, t*t);
    a2 = lerp(0.25, -0.85, t);
  } else if(boss.state === "throw"){
    const t = Math.min(1, boss.t / 0.22);
    a1 = lerp(-2.35, 1.30, Math.min(1, t*2.2));
    a2 = lerp(-0.85, 0.35, Math.min(1, t*2.2));
  } else {
    a1 = 0.42 + Math.sin(time*1.6)*0.06;
    a2 = 0.25;
  }
  return {a1, a2};
}

function drawBoss(){
  if(curBoss().id === "strelok")  return drawStrelok();
  if(curBoss().id === "snegovik") return drawSnegovik();
  drawGromila();
}

/* насколько соперник «взведён»: 0 — покой, 1 — оружие изготовлено */
function windupT(){
  if(boss.state === "windup") return Math.min(1, boss.t / WINDUP);
  if(boss.state === "throw")  return Math.max(0, 1 - boss.t/0.22);
  return 0;
}
